[workspace]
resolver = "2"
members = [
  "crates/lpk-api",
  "crates/lpk-bench",
  "crates/lpk-check",
  "crates/lpk-codecs-bwt",
  "crates/lpk-codecs-vp8",
  "crates/lpk-cli",
  "crates/lpk-core",
  "crates/lpk-format",
  "crates/lpk-fs-sys",
  "crates/lpk-gui",
  "crates/lpk-gui-e2e",
  "crates/lpk-gui-sys",
  "crates/lpk-procstat-sys",
  "crates/lpk-proto",
  "crates/lpk-test-worker",
  "crates/lpk-sandbox-sys",
  "crates/lpk-shell",
]
# cargo-fuzz crate: built with nightly on Linux only (fuzz/README.md).
# vendor/: patched third-party crates (below), built as dependencies, never as members.
exclude = ["fuzz", "vendor", "workers"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Charon89/litepack"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

# D-66: a patched copy of preflate-rs 0.7.6 that adds an output-limited recreation for the
# deflate-reconstruct decoder; what changed is in vendor/preflate-rs-0.7.6/LITEPACK-CHANGES.md.
[patch.crates-io]
preflate-rs = { path = "vendor/preflate-rs-0.7.6" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
