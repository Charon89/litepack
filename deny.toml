# cargo-deny policy — see docs/LICENSING.md. Run: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",            # MIT without the attribution clause: borrow-or-share (via jsonschema), D-25
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
# LGPL exceptions are allowed only by crate name (we are open source, so relinking is satisfied).
# `cabac` is required by preflate-rs (D-01, docs/LICENSING.md); no other crate may be listed here.
exceptions = [
  { crate = "cabac", allow = ["LGPL-3.0-or-later"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
