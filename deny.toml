# cargo-deny policy — see docs/LICENSING.md. Run: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# LGPL exceptions are allowed only by crate name (we are open source, so relinking is satisfied).
# Add entries like: { crate = "cabac", allow = ["LGPL-3.0"] } when the dependency is introduced.
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
