# Fuzz targets of lpk-format (cargo-fuzz / libFuzzer). Not a workspace member: see ../Cargo.toml.
[package]
name = "lpk-format-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lpk-format = { version = "0.0.1", path = "../crates/lpk-format" }

# An empty table detaches this crate from the root workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "frame_read"
path = "fuzz_targets/frame_read.rs"
test = false
doc = false
bench = false

