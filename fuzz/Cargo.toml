# Fuzz targets of lpk-format and lpk-core (cargo-fuzz / libFuzzer). Not a workspace member: see ../Cargo.toml.
[package]
name = "lpk-format-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lpk-format = { version = "0.0.1", path = "../crates/lpk-format" }
lpk-core = { version = "0.0.1", path = "../crates/lpk-core" }
# The forward transform (libsais) for `bwt_roundtrip`; the inverse and the layout for both bwt targets.
lpk-codecs-bwt = { version = "0.0.1", path = "../crates/lpk-codecs-bwt", features = ["encode"] }
# Its counting allocator: `bwt_decode` asserts nothing is allocated past the bound and the term.
lpk-procstat-sys = { version = "0.0.1", path = "../crates/lpk-procstat-sys" }
preflate-rs = "=0.7.6"

# An empty table detaches this crate from the root workspace.
[workspace]

# The root workspace's patch does not reach a detached crate: the same patched copy (D-66).
[patch.crates-io]
preflate-rs = { path = "../vendor/preflate-rs-0.7.6" }

[profile.release]
debug = 1

[[bin]]
name = "frame_read"
path = "fuzz_targets/frame_read.rs"
test = false
doc = false
bench = false

