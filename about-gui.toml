# cargo-about configuration for the GUI's part of THIRD-PARTY-NOTICES (E5-2): about.toml's policy over
# lpk-gui for the Windows triples it ships on (scripts/third-party-notices.sh renders about-gui.hbs with it).
# Keep everything but `targets` identical to about.toml.
# deny.toml's allow-list, in the order a choice is made for an `OR` expression.
accepted = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
]
# The GUI ships for Windows alone (Tauri is a cfg(windows) dependency of lpk-gui).
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own unpublished crates are not third-party; the third-party code inside them is in about.hbs's static
# section.
private = { ignore = true }

# lepton_jpeg ships no licence file: its Apache-2.0 header with Microsoft's copyright line.
[lepton_jpeg.clarify]
license = "Apache-2.0"
[[lepton_jpeg.clarify.files]]
path = "src/lib.rs"
start = "/*---"
end = "*/"
checksum = "a3eec853c4df9269b68e0a2dbf3543c75a33444d3705d2af10f2eac8b35f1955"

