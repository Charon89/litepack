# E8-5 (PLAN E8 decision (c)): the toolchain is pinned to an exact stable release, so that every
# machine and every CI job builds with the same compiler and the shipped binaries can be rebuilt
# bit for bit. CI installs from this file (`rustup toolchain install` with no argument).
#
# Bumping the pin (docs/UNSAFE.md does not change; the D-entry of E8-5 records this procedure):
#   1. `rustup update stable` and read `rustc +stable --version`;
#   2. set `channel` below to that version (for example "1.100.0"); nothing else changes;
#   3. run fmt, clippy -D warnings, nextest, deny and the notices check locally (new lints
#      arrive with a new compiler), in both workspaces;
#   4. commit as `chore(toolchain): pin Rust <version>`; the CI run of that PR (with the
#      reproducible-build compare and the ARM64 smoke of release-checks.yml) is the evidence.
# The fuzz workflow keeps its own dated nightly (`cargo +nightly-...`), which overrides this file.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
