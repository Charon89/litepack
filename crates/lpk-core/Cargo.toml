[package]
name = "lpk-core"
description = "LitePack pipeline: ingest, store path, classifier, entropy gate, clustering and the Fast (zstd) tier; later Fold, Peel, Model and Seal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lpk-format = { path = "../lpk-format", version = "0.0.1" }
same-file = "1.0.6"
thiserror = "2.0.21"
zstd = { version = "0.14.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
blake3 = "1.8.7"
liblzma = { version = "0.4.8", features = ["static"] }
tempfile = "3.27.0"
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
