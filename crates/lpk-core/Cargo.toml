[package]
name = "lpk-core"
description = "LitePack pipeline: ingest, store path, classifier, entropy gate, clustering and the Fast (zstd) tier; later Fold, Peel, Model and Seal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about (about.toml `private.ignore`) leaves our own crates out of THIRD-PARTY-NOTICES.
publish = false

[dependencies]
blake3 = "1.8.7"
fastcdc = "5.0.0"
# C zlib: the backend lpk-bench enables and the probe and the committed vectors were produced
# with, so a build of lpk-cli alone and a workspace build inflate (and walk) identically.
flate2 = { version = "1.1.10", features = ["zlib"] }
# Globs over entry paths (E3-4: `--exclude`, the patterns of `x`, `l` and `export`);
# Unlicense OR MIT, already in the tree for lpk-bench.
globset = "0.4.20"
# Pinned: the jpeg-reconstruct decoder reads the stream header layout of 0.5.8 (spec section 8).
lepton_jpeg = "=0.5.8"
liblzma = { version = "0.4.8", features = ["static", "parallel"] }
# The `bwt` decoder of revision 1.3 (safe Rust) and, with the `encode` feature, libsais's
# forward transform for the Balanced tier's BWT stage (E2-15 task D; the one C library the
# writer links for it). `lpk-format` and `lpk-decode` stay without it.
lpk-codecs-bwt = { path = "../lpk-codecs-bwt", version = "0.0.1", default-features = false, features = ["encode"] }
lpk-format = { path = "../lpk-format", version = "0.0.1" }
# E4-2: the broker protocol (frames; no parser).
lpk-proto = { path = "../lpk-proto", version = "0.0.1" }
# Pinned: deflate-reconstruct records carry this version's corrections (design section 2.2).
preflate-rs = "=0.7.6"
same-file = "1.0.6"
thiserror = "2.0.21"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.0", default-features = false }

# The physical-memory query of the default memory budget (E2-20; the workspace's -sys crate,
# which supports Windows and Linux only; elsewhere the budget falls back to the ceiling).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
lpk-procstat-sys = { path = "../lpk-procstat-sys", version = "0.0.1" }
# E4-2: the sandboxed launch of the foreign-format worker (the workspace's -sys crate).
lpk-sandbox-sys = { path = "../lpk-sandbox-sys", version = "0.0.1" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
blake3 = "1.8.7"
# Crafted correction streams for the refusals of LITEPACK-CHANGES change 8 (LIC-2).
lpk-codecs-vp8 = { path = "../lpk-codecs-vp8", version = "0.0.1" }
lpk-check = { path = "../lpk-check", version = "0.0.1" }
# libsais's forward transform for the bwt vector, the 64 MiB round trip and the memory test.
lpk-codecs-bwt = { path = "../lpk-codecs-bwt", version = "0.0.1", features = ["encode"] }
# Its counting allocator, for the deflate-reconstruct memory term test (the one crate allowed unsafe).
lpk-procstat-sys = { path = "../lpk-procstat-sys", version = "0.0.1" }
serde_json = "1.0.151"
tempfile = "3.27.0"
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
