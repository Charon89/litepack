[package]
name = "lpk-gui"
description = "LitePack's Windows GUI (E5): a Tauri 2 host over lpk-api, with a command layer tested without a webview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about (about.toml `private.ignore`) leaves our own crates out of THIRD-PARTY-NOTICES.
publish = false
# No `lpk-*` dependency but lpk-api and lpk-gui-sys: crates/lpk-api/tests/gui_seam.rs (the closed-build seam, D-110).

[[bin]]
name = "lpk-gui"
path = "src/main.rs"

[dependencies]
lpk-api = { path = "../lpk-api", version = "0.0.1" }
lpk-gui-sys = { path = "../lpk-gui-sys", version = "0.0.1" }
# Grant tokens: random, so that one window cannot guess another's.
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Tauri is a Windows-only dependency (docs/notes/e5-design.md section 1): on Linux the crate
# builds the command layer and a stub `main`. Its tree is checked by `cargo deny` for the shipped
# Windows triples only (deny-gui.toml); the main check excludes this crate (deny.toml).
[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false , features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
