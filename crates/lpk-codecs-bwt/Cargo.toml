[package]
name = "lpk-codecs-bwt"
description = "LitePack BWT codec: libsais forward transform, a safe inverse, and a bzip2-structured entropy stage with arithmetic coding (E2-15 measured gate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about (about.toml `private.ignore`) leaves our own crates out of THIRD-PARTY-NOTICES.
publish = false

[features]
# The forward transform through libsais (the only C code); a reader build leaves it off.
encode = ["dep:libsais"]

[dependencies]
# MIT OR Apache-2.0 (the C sources in libsais-sys: Apache-2.0, docs/LICENSING.md); the
# `openmp` feature stays off. Linked only with the `encode` feature.
libsais = { version = "0.2.0", default-features = false, optional = true }

[dev-dependencies]
# The crate's tests check the inverse against the forward transform.
lpk-codecs-bwt = { path = ".", features = ["encode"] }

[lints]
workspace = true
