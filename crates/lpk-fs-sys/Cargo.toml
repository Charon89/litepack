[package]
name = "lpk-fs-sys"
description = "Extraction output on Windows through verified directory handles: relative NtCreateFile opens with OBJ_DONT_REPARSE, link reparse tags refused, file IDs, symlinks under the privilege"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about (about.toml `private.ignore`) leaves our own crates out of THIRD-PARTY-NOTICES.
publish = false

[features]
# Test builds only (lpk-core enables it from its dev-dependencies; never in a release build,
# as D-99 (8)'s hooks; `scripts/check-release-hooks.sh` checks the release feature tree): a
# per-thread switch that adds FILE_SHARE_DELETE to the held directory handles, so the TOCTOU
# test can show where a create lands when a verified directory is swapped.
test-hooks = []

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

# This crate is allowed `unsafe` (CLAUDE.md: `*-sys` crates), so it cannot inherit the workspace
# table (which forbids it). Every `unsafe` block carries a `// SAFETY:` comment (denied otherwise).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3.27.0"
