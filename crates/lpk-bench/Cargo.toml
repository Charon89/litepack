[package]
name = "lpk-bench"
description = "LitePack benchmark corpus builder, baseline runner, component probes and report generator (Phase 0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
globset = "0.4.20"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
toml = "1.1.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
