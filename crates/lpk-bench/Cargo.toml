[package]
name = "lpk-bench"
description = "LitePack benchmark corpus builder, baseline runner, component probes and report generator (Phase 0)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
blake3 = "1.8.7"
chacha20 = "0.10.2"
clap = { version = "4.6.7", features = ["derive"] }
claxon = "0.4.3"
ctr = "0.10.1"
flate2 = { version = "1.1.10", features = ["zlib"] }
libz-sys = { version = "1.1.29", features = ["static"] }
globset = "0.4.20"
httpdate = "1.0.3"
sha1 = "0.10.6"
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["platform_independent"] }
miniz_oxide = "0.8.9"
png = "0.18.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
toml = "1.1.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
