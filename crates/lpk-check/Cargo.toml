[package]
name = "lpk-check"
description = "An independent decoder of the .lpk v1 format, written from docs/spec/lpk-v1.md alone (E1-14c)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "lpk-check"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
ruzstd = "0.9"
lzma-rs = "0.3"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = "0.6"
hkdf = "0.13"
sha2 = "0.11"
reed-solomon-simd = "3.1"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
toml = "1.1"

[lints]
workspace = true
