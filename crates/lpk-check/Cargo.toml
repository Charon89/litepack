[package]
name = "lpk-check"
description = "An independent decoder of the .lpk v1 format, written from docs/spec/lpk-v1.md alone (E1-14c)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "lpk-check"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
ruzstd = "0.9"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = "0.6"
hkdf = "0.13"
sha2 = "0.11"
lepton_jpeg = "=0.5.8"
flate2 = "1.1.10"
preflate-rs = "=0.7.6"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
toml = "1.1"
lzma-rs = "0.3"
# The reference full reader and writer, called as a black box by the crafted-record test of
# revision 1.4 (tests/png_crafted.rs); never read for the decoder.
lpk-format = { path = "../lpk-format", version = "0.0.1" }
lpk-core = { path = "../lpk-core", version = "0.0.1" }

[lints]
workspace = true
