[package]
name = "lpk-procstat-sys"
description = "Run one external program and measure wall time, CPU time and peak memory of its whole process tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# This crate is the one place allowed to use `unsafe` (CLAUDE.md: `*-sys` crates), so it cannot
# inherit the workspace table (which forbids it). Everything else mirrors the workspace table.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[dev-dependencies]
tempfile = "3.27.0"
