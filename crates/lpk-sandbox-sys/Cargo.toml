[package]
name = "lpk-sandbox-sys"
description = "Start a foreign-format worker in a sandbox: LPAC AppContainer (default) or restricted token, in a job object, with no inherited handle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Test-only worker: reports over its pipe what it can and cannot do. Not shipped.
name = "lpk-sandbox-testworker"
path = "src/bin/lpk-sandbox-testworker.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
  "Wdk_Foundation",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# This crate is allowed `unsafe` (CLAUDE.md: `*-sys` crates), so it cannot inherit the workspace
# table (which forbids it). Every `unsafe` block carries a `// SAFETY:` comment (denied otherwise).
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3.27.0"
