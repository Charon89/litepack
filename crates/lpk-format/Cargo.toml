[package]
name = "lpk-format"
description = "LitePack .lpk container format: frame grammar, header and reference reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
ruzstd = { version = "0.9.0", default-features = false, features = ["std", "hash"] }
lzma-rs = { version = "=0.3.0", features = ["raw_decoder"] }
reed-solomon-simd = "3.1.0"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = "0.11"
zeroize = "1.9.0"
rand = "0.9"

[dev-dependencies]
liblzma = "0.4.8"
proptest = "1.11.0"
tempfile = "3.27.0"
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
