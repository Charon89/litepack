[package]
name = "lpk-cli"
description = "The lpk command line: create, extract and test .lpk archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about (about.toml `private.ignore`) leaves our own crates out of THIRD-PARTY-NOTICES.
publish = false

[[bin]]
name = "lpk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Ctrl-C (E3-3): the handler cancels the engine's token (MIT OR Apache-2.0).
ctrlc = "3.5.2"
lpk-core = { path = "../lpk-core", version = "0.0.1" }
lpk-format = { path = "../lpk-format", version = "0.0.1" }
rpassword = "7.5.4"
serde_json = "1.0.151"
zeroize = "1.9.0"
# `lpk export`: 7z through sevenz-rust2 (Apache-2.0; already in the tree for lpk-bench's
# corpus extraction): LZMA2, Deflate and store, AES-256 with the archive's password.
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress", "deflate", "aes256"] }
# `lpk export`: ZIP through the zip crate (MIT; lpk-core's Deflate peel already reads with it):
# Deflate (flate2 with the zlib-rs backend), zstd (method 93), store; AES-256 (AE-2).
zip = { version = "9.0.4", default-features = false, features = ["deflate", "zstd", "aes-crypto"] }

[dev-dependencies]
blake3 = "1.8.7"
# The names test (E2-23) reads the archive back with the independent decoder.
lpk-check = { path = "../lpk-check", version = "0.0.1" }
clap-markdown = "0.1.5"
clap_mangen = "0.3.3"
lpk-procstat-sys = { path = "../lpk-procstat-sys", version = "0.0.1" }
# E4-2's routing test writes the test fixture.
lpk-proto = { path = "../lpk-proto", version = "0.0.1" }
tempfile = "3.27.0"
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

# E4-2's routing test creates an AppContainer profile per test and grants it the test worker.
[target.'cfg(any(windows, target_os = "linux"))'.dev-dependencies]
lpk-sandbox-sys = { path = "../lpk-sandbox-sys", version = "0.0.1" }

[lints]
workspace = true
