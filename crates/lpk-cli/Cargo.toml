[package]
name = "lpk-cli"
description = "The lpk command line: create, extract and test .lpk archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lpk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lpk-core = { path = "../lpk-core", version = "0.0.1" }
lpk-format = { path = "../lpk-format", version = "0.0.1" }
rpassword = "7.5.4"
serde_json = "1.0.151"
zeroize = "1.9.0"

[dev-dependencies]
blake3 = "1.8.7"
clap-markdown = "0.1.5"
clap_mangen = "0.3.3"
lpk-procstat-sys = { path = "../lpk-procstat-sys", version = "0.0.1" }
tempfile = "3.27.0"
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder"] }

[lints]
workspace = true
