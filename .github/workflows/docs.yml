name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older runs; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache the mdBook binary
        id: cache-mdbook
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-${{ env.MDBOOK_VERSION }}-ubuntu-24.04
      - name: Install mdBook
        if: steps.cache-mdbook.outputs.cache-hit != 'true'
        # Outside the checkout, so rust-toolchain.toml does not make rustup fetch the pinned toolchain.
        working-directory: ${{ runner.temp }}
        run: cargo install mdbook --version "$MDBOOK_VERSION" --locked
      - name: Footer check
        run: bash scripts/check-book-footer.sh
      - name: Book sources check (spec and CLI pages are includes, the method document is not published)
        run: |
          bash scripts/check-book-sources.sh --self-test
          bash scripts/check-book-sources.sh
      - name: Build the book
        run: mdbook build book
      - name: Link check (offline; external links listed, not fetched)
        run: |
          bash scripts/check-book-links.sh --self-test
          bash scripts/check-book-links.sh book/book
      - name: Built book check (spec, CLI and licensing pages rendered from the committed files; notices page equal to THIRD-PARTY-NOTICES)
        run: bash scripts/check-book-sources.sh --built book/book
      # The site publishes no font files (docs/LICENSING.md: Source Code Pro is OFL-1.1, not on the allow-list);
      # book/theme/fonts/fonts.css keeps mdBook's bundled fonts out, and an mdBook upgrade must not bring them back.
      - name: No font or third-party licence file in the site
        run: |
          found=$(find book/book \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' -o -iname '*LICENSE*' \) -print)
          if [ -n "$found" ]; then echo "the site would publish: $found"; exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
