name: Fuzz

# Bounded libFuzzer runs of every lpk-format reader target (fuzz/README.md). Manual, plus a
# weekly run. A crash fails the job and uploads the artifacts.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        type: string
        default: "120"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly; pinned by date so a run is reproducible.
  LPK_FUZZ_TOOLCHAIN: nightly-2026-09-28

jobs:
  fuzz:
    name: fuzz all targets (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Nightly toolchain
        run: rustup toolchain install "$LPK_FUZZ_TOOLCHAIN" --profile minimal
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build every target
        working-directory: fuzz
        run: cargo "+$LPK_FUZZ_TOOLCHAIN" fuzz build
      - name: Run every target
        run: fuzz/run.sh -t "${{ inputs.seconds || '120' }}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
