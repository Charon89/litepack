name: Fuzz

# Bounded libFuzzer runs of every lpk-format reader target (fuzz/README.md). Manual, plus a
# weekly run. A crash fails the job and uploads the artifacts.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        type: string
        default: "120"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly; pinned by date so a run is reproducible.
  LPK_FUZZ_TOOLCHAIN: nightly-2026-09-28

jobs:
  fuzz:
    name: fuzz all targets (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # 15 targets x at most 1200 s, plus the builds.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Validate the time per target
        env:
          SECONDS_INPUT: ${{ inputs.seconds || '120' }}
        run: |
          case "$SECONDS_INPUT" in
            ''|*[!0-9]*) echo "seconds must be digits" >&2; exit 1 ;;
          esac
          if [ "$SECONDS_INPUT" -lt 1 ] || [ "$SECONDS_INPUT" -gt 1200 ]; then
            echo "seconds must be 1..1200" >&2; exit 1
          fi
          echo "FUZZ_SECONDS=$SECONDS_INPUT" >> "$GITHUB_ENV"
      - name: Nightly toolchain
        run: rustup toolchain install "$LPK_FUZZ_TOOLCHAIN" --profile minimal
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build every target
        working-directory: fuzz
        run: cargo "+$LPK_FUZZ_TOOLCHAIN" fuzz build
      - name: Run every target
        run: bash fuzz/run.sh -t "$FUZZ_SECONDS"
      - name: Failing targets
        if: failure()
        run: |
          grep -l -E "ERROR: libFuzzer|panicked|SUMMARY" fuzz/artifacts/logs/*.log 2>/dev/null || true
      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
