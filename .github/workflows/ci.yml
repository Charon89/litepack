name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: Linux build prerequisites (OpenSSL for native-tls)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # E8-5: the toolchain pinned in rust-toolchain.toml (version, components, targets), so the
      # cache key (rust-cache reads `rustc -vV`) follows the pin.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-about@0.9.2
      - name: Format
        run: cargo fmt --all -- --check
      # E8-7: `unsafe` only in the crates and modules docs/UNSAFE.md lists (both workspaces and
      # fuzz/); before Clippy, so that its finding, not a compile error, is what turns the job red.
      - name: Unsafe confined to the inventory
        shell: bash
        run: |
          bash scripts/check-unsafe.sh --self-test
          bash scripts/check-unsafe.sh
      # E6-6: the extraction test hooks stay out of the release lpk (D-99 (8)).
      - name: No test hooks in the release build
        shell: bash
        run: |
          bash scripts/check-release-hooks.sh --self-test
          bash scripts/check-release-hooks.sh
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo nextest run --locked --workspace --no-tests=pass
      - name: Licence and advisory policy
        run: cargo deny check
      # LIC-2: THIRD-PARTY-NOTICES regenerated from Cargo.lock over the shipped packages; red when a dependency
      # changed without regenerating it, or when a GPL-family licence text reaches the notices, crates/ or vendor/.
      - name: Third-party notices
        shell: bash
        run: scripts/third-party-notices.sh --check

  # E8's honesty rule: every bench/results directory the documents cite is in the tree.
  cited-results:
    name: cited results exist (ubuntu-24.04)
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cited results directories
        run: |
          bash scripts/check-cited-results.sh --self-test
          bash scripts/check-cited-results.sh

  # E4-2: the sandboxed workers live in their own workspace (workers/: own lockfile and deny.toml)
  # so the main workspace's feature unification cannot pull a C codec into them.
  workers:
    name: workers (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: workers
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # E8-5: the toolchain pinned in rust-toolchain.toml (version, components, targets), so the
      # cache key (rust-cache reads `rustc -vV`) follows the pin.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers -> ../target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default and faults)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features faults -- -D warnings
      # E4-3: the end-to-end tests drive the main workspace's debug `lpk` against this workspace's
      # worker; built first, and required (a missing `lpk` fails them instead of skipping).
      - name: Build lpk for the end-to-end tests
        working-directory: .
        run: cargo build --locked -p lpk-cli
      - name: Test (default and faults)
        env:
          LPK_REQUIRE_E2E: "1"
        run: |
          cargo nextest run --locked --no-tests=pass
          cargo nextest run --locked --no-tests=pass --features faults
      - name: Licence and advisory policy (C codec crates banned)
        run: cargo deny check
      - name: No faults feature and no C codec symbol in the release worker
        working-directory: .
        run: |
          bash scripts/check-worker-symbols.sh --self-test
          bash scripts/check-worker-symbols.sh

  # E8-2: the size-regression gate. Archive bytes are deterministic (D-60), so archive size is
  # gated here on every pull request; time never is (E8 decision (b)). The generated `ci` profile
  # is built from a fixed seed without network, lpk's shipped settings are measured on it, and
  # every row is compared with the golden results directory that bench/ci-golden.toml names: an
  # archive more than 1% larger, or a row missing on either side, fails the job. Refreshing the
  # goldens is described in bench/ci-golden.toml.
  size-gate:
    name: size regression (ubuntu-24.04)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      # A quicker release build for this job only; archive bytes do not depend on it (the goldens
      # come from the workspace's full release profile on Windows, and this job must match them).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Linux build prerequisites (OpenSSL for native-tls)
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # E8-5: the toolchain pinned in rust-toolchain.toml, as in the other jobs.
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: size-gate
      - name: Build the release lpk and lpk-bench
        run: cargo build --locked --release -p lpk-cli -p lpk-bench
      - name: Build the ci fixture set (generated, no network)
        run: target/release/lpk-bench corpus build --profile ci
      # The results go to the runner's temporary directory, not target/: rust-cache restores
      # target/, and a results directory of an earlier run there would be compared instead.
      - name: Measure lpk's fast, balanced and store settings on it
        shell: bash
        run: >-
          target/release/lpk-bench run --tools lpk --settings fast,balanced,store --profile ci
          --repeats 1 --threads 2 --results "$RUNNER_TEMP/size-gate"
      - name: Compare with the goldens
        shell: bash
        run: |
          dirs=("$RUNNER_TEMP"/size-gate/*/)
          test "${#dirs[@]}" -eq 1 || { echo "expected one results directory: ${dirs[*]}"; exit 1; }
          target/release/lpk-bench run --compare-sizes bench/ci-golden.toml "${dirs[0]}"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: size-gate-results
          path: ${{ runner.temp }}/size-gate
          if-no-files-found: ignore
