name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older runs (the shared runner queue was the
# bottleneck on 2026-10-26); runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: ${{ matrix.os }}
    # The Windows job took 30 minutes on 2026-10-26 (build, tests, notices, then the cache save).
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: Linux build prerequisites (OpenSSL for native-tls)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # E8-5: the toolchain pinned in rust-toolchain.toml (version, components, targets), so the
      # cache key (rust-cache reads `rustc -vV`) follows the pin.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-about@0.9.2
      - name: Format
        run: cargo fmt --all -- --check
      # E8-7: `unsafe` only in the crates and modules docs/UNSAFE.md lists (both workspaces and
      # fuzz/); before Clippy, so that its finding, not a compile error, is what turns the job red.
      - name: Unsafe confined to the inventory
        shell: bash
        run: |
          bash scripts/check-unsafe.sh --self-test
          bash scripts/check-unsafe.sh
      # E6-6: the extraction test hooks stay out of the release lpk (D-99 (8)).
      - name: No test hooks in the release build
        shell: bash
        run: |
          bash scripts/check-release-hooks.sh --self-test
          bash scripts/check-release-hooks.sh
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo nextest run --locked --workspace --no-tests=pass
      - name: Licence and advisory policy
        run: cargo deny check
      # E5-2: the GUI's tree (excluded above) for the Windows triples it ships on (crates/lpk-gui/deny.toml).
      - name: Licence and advisory policy (GUI, Windows triples)
        run: cargo deny --manifest-path crates/lpk-gui/Cargo.toml check
      # E5-2: no Node toolchain: no package manifest or lockfile in the tree, no Node set up by any workflow.
      - name: No Node
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|\.npmrc|node_modules/)'; then
            echo "the repository holds a Node manifest, lockfile or node_modules" >&2
            exit 1
          fi
          if grep -nE 'setup-node|\bnpm |\bnpx |\byarn |\bpnpm ' .github/workflows/*.yml | grep -v "grep -nE"; then
            echo "a workflow installs or runs Node" >&2
            exit 1
          fi
      # LIC-2: THIRD-PARTY-NOTICES regenerated from Cargo.lock over the shipped packages; red when a dependency
      # changed without regenerating it, or when a GPL-family licence text reaches the notices, crates/ or vendor/.
      - name: Third-party notices
        shell: bash
        run: scripts/third-party-notices.sh --check

  # E5-2: the Tauri GUI built with `cargo tauri build` (tauri-cli through cargo, no Node) and run against a
  # generated archive given on its command line: the page reports the rows it put in the window's DOM through
  # the `listing_shown` command and the host writes that report (LPK_GUI_SMOKE_REPORT), which
  # crates/lpk-gui/smoke.sh checks. The minimum Windows version is part of the matrix (docs/RELEASING.md).
  gui:
    name: gui (${{ matrix.os }}, minimum Windows ${{ matrix.windows-minimum }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            windows-minimum: "10.0.19045"
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: The minimum Windows build matches docs/RELEASING.md
        shell: bash
        run: grep -qF '| ${{ matrix.windows-minimum }} |' docs/RELEASING.md
      - name: tauri-cli through cargo (pinned)
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build lpk (makes the smoke archive)
        run: cargo build --locked -p lpk-cli
      - name: cargo tauri build
        working-directory: crates/lpk-gui
        run: cargo tauri build --ci -- --locked
      - name: The exe opens an archive from the command line
        shell: bash
        run: bash crates/lpk-gui/smoke.sh target/debug/lpk.exe target/release/lpk-gui.exe "$RUNNER_TEMP/gui-smoke"
      # Risk 2 of the E5 design: the MPL-2.0 crate option-ext is used only by dirs-sys on Unix; no symbol of it
      # may reach the Windows exe (webview2_com is the control: present).
      - name: No option-ext symbol in the PDB
        shell: bash
        run: |
          pdb=target/release/lpk_gui.pdb
          test "$(grep -a -c 'webview2_com::' "$pdb")" -gt 0
          if grep -a -qE 'option_ext::|10option_ext' "$pdb"; then
            echo "option-ext code reached lpk-gui.exe" >&2
            exit 1
          fi
      # R111: the WebDriver switch (lpk-gui's cargo feature `webdriver`, gui-e2e only) is not in the shipped exe
      # (the smoke report's variable is the control: present).
      - name: No WebDriver switch in the exe
        shell: bash
        run: |
          exe=target/release/lpk-gui.exe
          test "$(grep -a -c 'LPK_GUI_SMOKE_REPORT' "$exe")" -gt 0
          if grep -a -qF 'LPK_GUI_WEBDRIVER' "$exe"; then
            echo "the WebDriver switch reached the shipped lpk-gui.exe" >&2
            exit 1
          fi

  # E5-11's driver harness (crates/lpk-gui-e2e): lpk-gui.exe (its `webdriver` build) under the Edge WebDriver of the
  # WebView2 runtime's version opens an archive made by lpk; its rows reach the DOM and the page raised no
  # error, unhandled rejection, CSP violation or failure flag.
  gui-e2e:
    name: gui-e2e (windows-2025)
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-e2e
      - name: tauri-cli through cargo (pinned)
        env:
          # Third-party sources: their warnings are not ours to deny.
          RUSTFLAGS: ""
        run: |
          cargo install tauri-cli --version 2.12.4 --locked
      - name: Build lpk (makes the test archive)
        run: cargo build --locked --release -p lpk-cli
      - name: cargo tauri build (with the WebDriver switch)
        working-directory: crates/lpk-gui
        run: cargo tauri build --ci --features webdriver -- --locked
      - name: An Edge WebDriver of the WebView2 runtime's version
        shell: pwsh
        run: |
          # The WebView2 runtime's version (the Evergreen runtime's client key, machine-wide, then per-user).
          $key = 'SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = (Get-ItemProperty "HKLM:\$key" -ErrorAction SilentlyContinue).pv
          if (-not $runtime) {
            $runtime = (Get-ItemProperty 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          }
          if (-not $runtime) { throw "no WebView2 runtime version in the registry" }
          # The image's preinstalled driver when it matches; otherwise (no EdgeWebDriver, no file, another version)
          # the download.
          $driver = $null
          if ($env:EdgeWebDriver) {
            $preinstalled = Join-Path $env:EdgeWebDriver 'msedgedriver.exe'
            if (Test-Path -LiteralPath $preinstalled -PathType Leaf) {
              $line = & $preinstalled --version
              $driver = [regex]::Match("$line", '\d+\.\d+\.\d+\.\d+').Value
            }
          }
          Write-Output "WebView2 runtime $runtime; preinstalled Edge WebDriver: $(if ($driver) { $driver } else { 'none' })"
          if ($driver -and $driver -eq $runtime) {
            $native = $preinstalled
          } else {
            # Microsoft's official Edge WebDriver download location, the version pinned to the runtime's:
            # https://msedgedriver.microsoft.com/<version>/edgedriver_win64.zip
            $zip = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
            $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$runtime/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $native = Join-Path $dir 'msedgedriver.exe'
            # The fetched exe runs only with a valid Authenticode signature by Microsoft.
            $sig = Get-AuthenticodeSignature -LiteralPath $native
            Write-Output "signature: $($sig.Status); $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "the fetched driver's signature is $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)') {
              throw "the fetched driver is not signed by Microsoft: $($sig.SignerCertificate.Subject)"
            }
            $line = & $native --version
            Write-Output "fetched: $line"
            if ([regex]::Match("$line", '\d+\.\d+\.\d+\.\d+').Value -ne $runtime) { throw "the fetched driver is not $runtime" }
          }
          "LPK_E2E_NATIVE_DRIVER=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The driver harness
        env:
          LPK_GUI_E2E: "1"
          LPK_E2E_WORK: ${{ runner.temp }}/gui-e2e
        run: cargo test --locked -p lpk-gui-e2e -- --nocapture
      - name: After a failure, the processes and DevToolsActivePort files
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -match '^(lpk-gui|msedgewebview2|msedgedriver|tauri-driver)\.exe$' } |
            ForEach-Object { "$($_.ProcessId) $($_.Name): $($_.CommandLine)" }
          foreach ($root in @("$env:RUNNER_TEMP\gui-e2e", $env:TEMP, $env:LOCALAPPDATA)) {
            Get-ChildItem -Path $root -Recurse -Force -Filter DevToolsActivePort -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.FullName): $(Get-Content $_.FullName -Raw)" }
          }
          Get-ChildItem -Path "$env:RUNNER_TEMP\gui-e2e" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 60 FullName

  # E8's honesty rule: every bench/results directory the documents cite is in the tree.
  cited-results:
    name: cited results exist (ubuntu-24.04)
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cited results directories
        run: |
          bash scripts/check-cited-results.sh --self-test
          bash scripts/check-cited-results.sh

  # E4-2: the sandboxed workers live in their own workspace (workers/: own lockfile and deny.toml)
  # so the main workspace's feature unification cannot pull a C codec into them.
  workers:
    name: workers (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: workers
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # E8-5: the toolchain pinned in rust-toolchain.toml (version, components, targets), so the
      # cache key (rust-cache reads `rustc -vV`) follows the pin.
      - name: Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers -> ../target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default and faults)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features faults -- -D warnings
      # E4-3: the end-to-end tests drive the main workspace's debug `lpk` against this workspace's
      # worker; built first, and required (a missing `lpk` fails them instead of skipping).
      - name: Build lpk for the end-to-end tests
        working-directory: .
        run: cargo build --locked -p lpk-cli
      - name: Test (default and faults)
        env:
          LPK_REQUIRE_E2E: "1"
        run: |
          cargo nextest run --locked --no-tests=pass
          cargo nextest run --locked --no-tests=pass --features faults
      - name: Licence and advisory policy (C codec crates banned)
        run: cargo deny check
      - name: No faults feature and no C codec symbol in the release worker
        working-directory: .
        run: |
          bash scripts/check-worker-symbols.sh --self-test
          bash scripts/check-worker-symbols.sh

  # E8-2: the size-regression gate. Archive bytes are deterministic (D-60), so archive size is
  # gated here on every pull request; time never is (E8 decision (b)). The generated `ci` profile
  # is built from a fixed seed without network, lpk's shipped settings are measured on it, and
  # every row is compared with the golden results directory that bench/ci-golden.toml names: an
  # archive more than 1% larger, or a row missing on either side, fails the job. Refreshing the
  # goldens is described in bench/ci-golden.toml.
  size-gate:
    name: size regression (ubuntu-24.04)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      # A quicker release build for this job only; archive bytes do not depend on it (the goldens
      # come from the workspace's full release profile on Windows, and this job must match them).
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Linux build prerequisites (OpenSSL for native-tls)
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # E8-5: the toolchain pinned in rust-toolchain.toml, as in the other jobs.
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: size-gate
      - name: Build the release lpk and lpk-bench
        run: cargo build --locked --release -p lpk-cli -p lpk-bench
      - name: Build the ci fixture set (generated, no network)
        run: target/release/lpk-bench corpus build --profile ci
      # The results go to the runner's temporary directory, not target/: rust-cache restores
      # target/, and a results directory of an earlier run there would be compared instead.
      - name: Measure lpk's fast, balanced and store settings on it
        shell: bash
        run: >-
          target/release/lpk-bench run --tools lpk --settings fast,balanced,store --profile ci
          --repeats 1 --threads 2 --results "$RUNNER_TEMP/size-gate"
      - name: Compare with the goldens
        shell: bash
        run: |
          dirs=("$RUNNER_TEMP"/size-gate/*/)
          test "${#dirs[@]}" -eq 1 || { echo "expected one results directory: ${dirs[*]}"; exit 1; }
          target/release/lpk-bench run --compare-sizes bench/ci-golden.toml "${dirs[0]}"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: size-gate-results
          path: ${{ runner.temp }}/size-gate
          if-no-files-found: ignore
