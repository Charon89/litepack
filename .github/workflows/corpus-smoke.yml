name: Corpus smoke build

# Manual only: the small profile downloads over a gigabyte from third-party hosts, so it must
# never run on every push. Run it from the Actions tab to prove that `corpus build --profile
# small` completes, and is reproducible, on a clean Linux machine.
#
# A run only counts as a from-scratch download test when `use_cache` is false (the default).
#
# The download cache is saved after a run that added or changed files, also a failed one, under
# a per-run-attempt key (run id and attempt, since "Re-run jobs" keeps the run id), so a
# retry after a host outage does not fetch everything again. With `use_cache` the newest cache
# for the same bench/corpus.lock is restored. A partial cache is safe: the builder re-checks
# every cached file against the lock and fetches whatever is missing.
on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Restore the download cache (skips the downloads; not a clean-machine test)"
        type: boolean
        default: false
      run_smoke:
        description: "After the corpus builds, smoke-run the baseline runner on a few classes (not a measurement)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus-small:
    name: corpus build --profile small (ubuntu-24.04)
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux build prerequisites (OpenSSL for native-tls)
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # E8-5: the toolchain pinned in rust-toolchain.toml.
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
      # ffmpeg is deliberately not installed by this workflow. Whether the image already has it
      # is recorded below; the video encodes are skipped with a reason when it is absent.
      - name: Record whether ffmpeg and git are on PATH
        run: |
          {
            echo "### Runner tools"
            echo
            for t in ffmpeg git; do
              if command -v "$t" > /dev/null; then
                case "$t" in
                  ffmpeg) v=$(ffmpeg -version 2>&1 | head -n 1) ;;
                  *) v=$("$t" --version 2>&1 | head -n 1) ;;
                esac
                echo "- $t: on PATH, $v"
              else
                echo "- $t: not on PATH"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the corpus download cache
        id: dl-cache
        if: ${{ inputs.use_cache }}
        uses: actions/cache/restore@v6
        with:
          path: bench/corpus/.cache
          key: corpus-downloads-${{ hashFiles('bench/corpus.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            corpus-downloads-${{ hashFiles('bench/corpus.lock') }}-
      # A listing (name and size) of the download cache before the builds, to save a new cache
      # only when this run changed it. Partial downloads (.part) are not counted.
      - name: List the download cache before the builds
        run: |
          mkdir -p bench/corpus/.cache
          (cd bench/corpus/.cache && find . -type f ! -name '*.part' -printf '%P %s\n' | LC_ALL=C sort) > "$RUNNER_TEMP/cache-before.txt"
          echo "files before: $(wc -l < "$RUNNER_TEMP/cache-before.txt")"
      # E8-9: `lpk` too (the catalogue finds it at target/release/lpk), for the runner smoke below.
      - name: Build lpk-bench and lpk
        run: cargo build --release --locked -p lpk-bench -p lpk-cli
      # Step timeouts sit below the job timeout: a timed-out step fails (the save step below
      # still runs), whereas a timed-out job is cancelled and nothing after it runs.
      - name: Build the small corpus
        timeout-minutes: 80
        run: ./target/release/lpk-bench corpus build --profile small
      - name: Check whether the builds changed the download cache
        id: dl-changed
        if: ${{ !cancelled() }}
        run: |
          (cd bench/corpus/.cache && find . -type f ! -name '*.part' -printf '%P %s\n' | LC_ALL=C sort) > "$RUNNER_TEMP/cache-after.txt"
          if cmp -s "$RUNNER_TEMP/cache-before.txt" "$RUNNER_TEMP/cache-after.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "download cache unchanged: not saving"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "download cache changed: saving"
          fi
      # Saved even when the build step failed (a partial cache is safe, see the header), but only
      # when this run changed it. The key is unique per run attempt, so it never collides with the
      # cache that was restored or with an earlier attempt of the same run.
      - name: Save the corpus download cache
        if: ${{ !cancelled() && steps.dl-changed.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: bench/corpus/.cache
          key: corpus-downloads-${{ hashFiles('bench/corpus.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the first manifest
        run: cp bench/corpus/small/manifest.json first-manifest.json
      - name: Rebuild the small corpus from scratch
        timeout-minutes: 30
        run: |
          rm -rf bench/corpus/small
          ./target/release/lpk-bench corpus build --profile small
      - name: Fail if the two manifests differ
        run: cmp first-manifest.json bench/corpus/small/manifest.json
      # Smoke test of the baseline runner (`lpk-bench run`) on Linux. It proves that the runner,
      # the peak-memory measurement through getrusage, extraction and BLAKE3 verification work on
      # Linux with whatever free tools the image can install, and that tools it cannot find
      # (WinRAR, zpaqfranz, t-saur) are skipped with a reason. It does not prove anything about
      # speed or ratio: one repeat on a shared CI host, so no timing claim may be taken from it,
      # and the results are an artifact of this run only, never committed under bench/results/.
      # The `7zip` package provides `7zz`, the executable the catalogue looks for first.
      - name: Install the free baseline tools
        if: ${{ inputs.run_smoke }}
        run: sudo apt-get install -y --no-install-recommends zstd xz-utils 7zip
      # E8-9: the catalogue with `lpk`'s settings trimmed to `fast` and `balanced` (the runner has
      # no setting selector; every other tool and setting is kept as it is).
      - name: Catalogue with lpk's fast and balanced settings only
        if: ${{ inputs.run_smoke }}
        run: |
          python3 - bench/tools.toml "$RUNNER_TEMP/tools-smoke.toml" <<'PY'
          import re
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          keep = {"fast", "balanced"}
          chunks, cur = [], []
          for line in open(src, encoding="utf-8"):
              if re.match(r"\s*\[", line) and cur:
                  chunks.append(cur)
                  cur = []
              cur.append(line)
          chunks.append(cur)
          out, tool, kept = [], None, []
          for c in chunks:
              head = c[0].strip()
              ids = [m.group(1) for l in c if (m := re.match(r'\s*id\s*=\s*"([^"]+)"', l))]
              if head == "[[tool]]":
                  tool = ids[0] if ids else None
              elif head == "[[tool.setting]]" and tool == "lpk":
                  if not ids or ids[0] not in keep:
                      continue
                  kept.append(ids[0])
              out.extend(c)
          if sorted(kept) != sorted(keep):
              sys.exit(f"lpk settings kept: {kept}, expected {sorted(keep)}")
          open(dst, "w", encoding="utf-8").write("".join(out))
          print(f"lpk settings kept: {kept}")
          PY
      - name: List the tools the catalogue finds
        if: ${{ inputs.run_smoke }}
        run: ./target/release/lpk-bench run --list-tools --catalogue "$RUNNER_TEMP/tools-smoke.toml"
      - name: Smoke-run the baseline runner on the small corpus
        if: ${{ inputs.run_smoke }}
        timeout-minutes: 40
        run: |
          ./target/release/lpk-bench run --tools all --profile small --repeats 1 \
            --catalogue "$RUNNER_TEMP/tools-smoke.toml" \
            --classes archives-nested,source-git,small-files,photo-jpeg-edited \
            --results "$RUNNER_TEMP/results" --tmp "$RUNNER_TEMP/tmp"
      - name: Validate the smoke results against the schema
        if: ${{ inputs.run_smoke }}
        run: |
          dirs=("$RUNNER_TEMP"/results/*/)
          if [ "${#dirs[@]}" -ne 1 ]; then
            echo "expected exactly one results directory, found ${#dirs[@]}"
            exit 1
          fi
          ./target/release/lpk-bench run --validate "${dirs[0]%/}"
          # E8-9: the eight lpk rows (fast and balanced on the four classes), each verified.
          fail=0
          for s in fast balanced; do
            for c in archives-nested source-git small-files photo-jpeg-edited; do
              f="${dirs[0]}lpk-$s-$c.json"
              if [ ! -f "$f" ]; then echo "missing lpk row: $f"; fail=1
              elif ! grep -qE '"verified":[[:space:]]*true' "$f"; then echo "lpk row not verified: $f"; fail=1
              else echo "lpk row verified: lpk-$s-$c"; fi
            done
          done
          exit "$fail"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.run_smoke }}
        with:
          name: smoke-results-small-linux
          path: ${{ runner.temp }}/results
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary
        if: ${{ always() }}
        env:
          USE_CACHE: ${{ inputs.use_cache }}
          CACHE_MATCHED_KEY: ${{ steps.dl-cache.outputs.cache-matched-key }}
        run: |
          python3 - >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}" <<'PY'
          import json
          import os

          path = os.environ.get("INFO_PATH", "bench/corpus/small/build-info.json")
          try:
              with open(path, encoding="utf-8") as f:
                  info = json.load(f)
              if not isinstance(info, dict):
                  info = {}
          except (OSError, ValueError):
              info = {}
          use_cache = os.environ.get("USE_CACHE", "") == "true"
          matched = os.environ.get("CACHE_MATCHED_KEY", "")
          print("## Corpus small build")
          print()
          print(f"- download cache used: {'yes' if use_cache else 'no'}")
          if not use_cache:
              restored = "none (not requested)"
          elif matched:
              restored = f"`{matched}`"
          else:
              restored = "none (no cache matched)"
          print(f"- download cache restored: {restored}")
          if not info:
              print("- build-info.json: missing or unreadable")
          print(f"- manifest BLAKE3: {info.get('manifest_blake3', 'unknown')}")
          print()
          print(
              "The manifest comparison in this job is between two builds on this runner only; "
              "it does not show that Linux matches Windows. Compare the BLAKE3 above with a "
              "Windows build by hand."
          )
          classes = (info.get("summary") or {}).get("classes") or {}
          if classes:
              print()
              print("| class | files | bytes |")
              print("| --- | ---: | ---: |")
              for name, c in classes.items():
                  print(f"| {name} | {c.get('files')} | {c.get('bytes')} |")
          for key, empty in (("tools", {}), ("skipped", []), ("unavailable", [])):
              print()
              print(f"### {key}")
              print()
              print("```json")
              print(json.dumps(info.get(key, empty), indent=2, sort_keys=True))
              print("```")
          PY
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: corpus-small-metadata
          path: |
            bench/corpus/small/manifest.json
            bench/corpus/small/build-info.json
          if-no-files-found: warn
