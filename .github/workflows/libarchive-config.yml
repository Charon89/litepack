name: libarchive config.h

# E4-4 (R203): the three vendor/libarchive-*/litepack-config/<target>/config.h are generated by libarchive's own
# CMake (scripts/libarchive-config.sh) on each target's runner; this job regenerates each and fails on a difference,
# printing the generated file so it can be copied into the repository. The release is pinned in
# scripts/libarchive-release.env.
on:
  pull_request:
    paths:
      - "vendor/libarchive-*/**"
      - "scripts/libarchive-config.sh"
      - "scripts/libarchive-release.env"
      - ".github/workflows/libarchive-config.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  config:
    name: config.h ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-2025, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The pinned libarchive release
        run: |
          set -euo pipefail
          grep -E '^LIBARCHIVE_[A-Z0-9_]+=' scripts/libarchive-release.env >> "$GITHUB_ENV"
      - name: Tool versions (for the log)
        run: |
          cmake --version | head -n 1
          if [ "$RUNNER_OS" = Windows ]; then cmake --help | grep 'Visual Studio'; else cc --version | head -n 1; fi
      - name: Download and verify the release
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$LIBARCHIVE_FILE" "$LIBARCHIVE_URL"
          actual="$(sha256sum < "$RUNNER_TEMP/$LIBARCHIVE_FILE" | cut -d' ' -f1)"
          if [ "$actual" != "$LIBARCHIVE_SHA256" ]; then
            echo "::error::$LIBARCHIVE_FILE has SHA-256 $actual, the pin says $LIBARCHIVE_SHA256"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/la-src"
          # No path reaches tar: on Windows "D:\a\_temp" is read as a remote host (and --force-local
          # then mangles the backslashes), so tar reads stdin and runs inside the target directory.
          (cd "$RUNNER_TEMP/la-src" && tar -xz --strip-components=1) < "$RUNNER_TEMP/$LIBARCHIVE_FILE"
      - name: Generate config.h with libarchive's CMake
        run: |
          set -euo pipefail
          bash scripts/libarchive-config.sh "${{ matrix.target }}" "$RUNNER_TEMP/la-src" "$RUNNER_TEMP/config.h"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: config-h-${{ matrix.target }}
          path: ${{ runner.temp }}/config.h
          if-no-files-found: ignore
      - name: The committed file equals the generated one
        run: |
          set -euo pipefail
          committed="vendor/libarchive-${LIBARCHIVE_VERSION}/litepack-config/${{ matrix.target }}/config.h"
          # --strip-trailing-cr: a Windows checkout may turn the committed LF into CRLF.
          if ! diff -u --strip-trailing-cr "$committed" "$RUNNER_TEMP/config.h"; then
            echo "::error::$committed differs from the generated file; the generated file is printed below"
            echo "=====BEGIN GENERATED ${{ matrix.target }} config.h====="
            cat "$RUNNER_TEMP/config.h"
            echo "=====END GENERATED ${{ matrix.target }} config.h====="
            echo "SHA-256 of the generated file (LF line ends): $(tr -d '\r' < "$RUNNER_TEMP/config.h" | sha256sum | cut -d' ' -f1)"
            exit 1
          fi
          echo "$committed is what libarchive's CMake generates"
