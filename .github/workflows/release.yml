name: Release

# E7-2 part 1 (docs/notes/e7-design.md section 1; docs/RELEASING.md "The release workflow"): the release workflow
# without the signing identity. Part 1b builds the six shipped PEs for x64 and ARM64 the way release-checks.yml's
# reproducible job compares them (scripts/e7-release-build.sh, through scripts/repro-build.sh), bundles both
# per-user NSIS installers from those very binaries, and runs the ARM64 installer on both architectures: refused on
# x64, installed and uninstalled on ARM64. Nothing is signed, nothing is published: no release, no tag, no GitHub
# deployment target, no stored credential, no OIDC token, no cache (part 2 adds signing and publishing). Part 1c adds
# the release's assets: both zips per architecture beside the installers, SHA256SUMS, the notices finder and the
# classification of every PE inside them (assemble), and a smoke run of the zips on both architectures (smoke-x64,
# smoke-arm64). Part 1d adds one CycloneDX SBOM per shipped binary (made by the build jobs, packed by assemble into
# the seventh asset, litepack-<v>-sbom.zip); part 1e adds the install checks with the residue diff. Every action is
# pinned by its commit SHA, the tag in a comment; the preflight job checks this file for that
# (scripts/e7-preflight.py workflow).
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/repro-build.sh
      - scripts/make-zips.py
      - scripts/release-tools.env
      - scripts/cargo-auditable.cmd
      - scripts/e7-*
      - crates/lpk-gui/installer*.nsh
      - crates/lpk-gui/tauri*.conf.json
      - rust-toolchain.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/repro-build.sh
      - scripts/make-zips.py
      - scripts/release-tools.env
      - scripts/cargo-auditable.cmd
      - scripts/e7-*
      - crates/lpk-gui/installer*.nsh
      - crates/lpk-gui/tauri*.conf.json
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

# As release-checks.yml: a newer push to a pull request cancels its older runs; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The versions agree, the release is not releasable yet (unsigned, the updater key a placeholder), and this file
  # pins every action by SHA with read-only permissions.
  preflight:
    name: preflight (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      - name: The preflight and overlay scripts' own tests
        run: |
          python -I scripts/e7-preflight.py --self-test
          python -I scripts/e7-nsis-overlay.py --self-test
      - name: Versions and releasability
        id: version
        run: |
          python -I scripts/e7-preflight.py version | tee "$RUNNER_TEMP/version.txt"
          v="$(sed -n 's/^version: //p' "$RUNNER_TEMP/version.txt")"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: This workflow's pins and permissions
        run: python -I scripts/e7-preflight.py workflow .github/workflows/release.yml

  # tauri-cli, cargo-auditable and cargo-cyclonedx at the versions of scripts/release-tools.env, built once and handed
  # to every later job with their SHA-256 list; the list's own hash is this job's output, so a later job checks both.
  tools:
    name: build tools (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      list: ${{ steps.list.outputs.sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - name: cargo install tauri-cli, cargo-auditable and cargo-cyclonedx (scripts/release-tools.env)
        run: |
          set -euo pipefail
          source scripts/release-tools.env
          root="$(cygpath -u "$RUNNER_TEMP")/tools"
          cargo install --locked --root "$root" --version "=$TAURI_CLI_VERSION" tauri-cli
          cargo install --locked --root "$root" --version "=$CARGO_AUDITABLE_VERSION" cargo-auditable
          cargo install --locked --root "$root" --version "=$CARGO_CYCLONEDX_VERSION" cargo-cyclonedx
          PATH="$root/bin:$PATH" cargo tauri --version
          PATH="$root/bin:$PATH" cargo auditable --version
          PATH="$root/bin:$PATH" cargo cyclonedx --version
      - name: tools.sha256
        id: list
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/tools/bin"
          ls -la
          sha256sum cargo-tauri.exe cargo-auditable.exe cargo-cyclonedx.exe > tools.sha256
          test "$(wc -l < tools.sha256)" = 3
          cat tools.sha256
          echo "sha256=$(sha256sum tools.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          path: ${{ runner.temp }}/tools/bin
          retention-days: 3
          if-no-files-found: error

  # The two build jobs: one script (scripts/e7-release-build.sh), two named jobs so that each can output the hash of
  # its own unsigned.sha256 and of its sboms.sha256 (a matrix's legs cannot have separate outputs). The artifact also
  # holds sboms/, the six SBOMs (part 1d), listed in sboms.sha256: a second list, so that unsigned.sha256 stays the
  # list of the six PEs that package, install-arm64 and assemble read line by line.
  build-x64:
    name: build x64 (windows-2025)
    needs: [preflight, tools]
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      list: ${{ steps.list.outputs.sha256 }}
      sboms: ${{ steps.list.outputs.sboms }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tools
          path: ${{ runner.temp }}/tools
      - name: Check the tools against tools.sha256 and its hash, then put them on PATH
        env:
          TOOLS_LIST: ${{ needs.tools.outputs.list }}
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/tools"
          test "$(sha256sum tools.sha256 | cut -d ' ' -f 1)" = "$TOOLS_LIST" || { echo "tools.sha256 is not the tools job's"; exit 1; }
          sha256sum -c tools.sha256
          cygpath -w "$PWD" >> "$GITHUB_PATH"
      - name: Build the six shipped PEs and their SBOMs (scripts/e7-release-build.sh x64)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test -n "$VERSION"
          cargo tauri --version
          cargo auditable --version
          cargo cyclonedx --version
          python -I scripts/e7-sboms.py --self-test
          bash scripts/e7-release-build.sh x64 "$(cygpath -u "$RUNNER_TEMP")/unsigned-x64" "$VERSION"
      - name: The hashes of unsigned.sha256 and sboms.sha256
        id: list
        run: |
          d="$(cygpath -u "$RUNNER_TEMP")/unsigned-x64"
          echo "sha256=$(sha256sum "$d/unsigned.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sboms=$(sha256sum "$d/sboms.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-x64
          path: ${{ runner.temp }}/unsigned-x64
          retention-days: 7
          if-no-files-found: error

  build-arm64:
    name: build arm64 (windows-2025)
    needs: [preflight, tools]
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      list: ${{ steps.list.outputs.sha256 }}
      sboms: ${{ steps.list.outputs.sboms }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          rustup target list --installed
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tools
          path: ${{ runner.temp }}/tools
      - name: Check the tools against tools.sha256 and its hash, then put them on PATH
        env:
          TOOLS_LIST: ${{ needs.tools.outputs.list }}
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")/tools"
          test "$(sha256sum tools.sha256 | cut -d ' ' -f 1)" = "$TOOLS_LIST" || { echo "tools.sha256 is not the tools job's"; exit 1; }
          sha256sum -c tools.sha256
          cygpath -w "$PWD" >> "$GITHUB_PATH"
      - name: Build the six shipped PEs and their SBOMs (scripts/e7-release-build.sh arm64)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          test -n "$VERSION"
          cargo tauri --version
          cargo auditable --version
          cargo cyclonedx --version
          python -I scripts/e7-sboms.py --self-test
          bash scripts/e7-release-build.sh arm64 "$(cygpath -u "$RUNNER_TEMP")/unsigned-arm64" "$VERSION"
      - name: The hashes of unsigned.sha256 and sboms.sha256
        id: list
        run: |
          d="$(cygpath -u "$RUNNER_TEMP")/unsigned-arm64"
          echo "sha256=$(sha256sum "$d/unsigned.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sboms=$(sha256sum "$d/sboms.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-arm64
          path: ${{ runner.temp }}/unsigned-arm64
          retention-days: 7
          if-no-files-found: error

  # Both installers from the build jobs' binaries: `cargo tauri bundle` compiles nothing; the GUI goes where the
  # bundler looks for it, the overlay (scripts/e7-nsis-overlay.py) names the other PEs in the downloaded artifact and
  # the architecture's hooks file. --no-binary-patching: the installed lpk-gui.exe is the built one (checked below
  # through 7-Zip, and after the ARM64 install). The bundler may download NSIS here (part 2 proves it does not).
  package:
    name: NSIS installers (windows-2025)
    needs: [preflight, tools, build-x64, build-arm64]
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      list: ${{ steps.list.outputs.sha256 }}
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      VERSION: ${{ needs.preflight.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      # tauri-cli reads the workspace's cargo metadata, so the pinned toolchain is installed (nothing is compiled).
      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - name: Work folders
        run: |
          echo "T=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          echo "source commit time: ${{ needs.preflight.outputs.timestamp }}, version $VERSION"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tools
          path: ${{ runner.temp }}/tools
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-x64
          path: ${{ runner.temp }}/unsigned-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-arm64
          path: ${{ runner.temp }}/unsigned-arm64
      - name: Check every download against its list and every list against its job's output
        env:
          TOOLS_LIST: ${{ needs.tools.outputs.list }}
          X64_LIST: ${{ needs.build-x64.outputs.list }}
          ARM64_LIST: ${{ needs.build-arm64.outputs.list }}
        run: |
          set -euo pipefail
          check() {
            local dir="$1" list="$2" want="$3"
            test -n "$want" || { echo "no expected hash for $dir/$list"; exit 1; }
            got="$(sha256sum "$dir/$list" | cut -d ' ' -f 1)"
            test "$got" = "$want" || { echo "$dir/$list: $got, the job's output is $want"; exit 1; }
            (cd "$dir" && sha256sum -c "$list")
          }
          check "$T/tools" tools.sha256 "$TOOLS_LIST"
          check "$T/unsigned-x64" unsigned.sha256 "$X64_LIST"
          check "$T/unsigned-arm64" unsigned.sha256 "$ARM64_LIST"
          test "$(wc -l < "$T/unsigned-x64/unsigned.sha256")" = 6
          test "$(wc -l < "$T/unsigned-arm64/unsigned.sha256")" = 6
          cygpath -w "$T/tools" >> "$GITHUB_PATH"
      - name: Bundle the x64 and ARM64 installers
        run: |
          set -euo pipefail
          cargo tauri --version
          mkdir -p "$T/installers"
          for arch in x64 arm64; do
            case "$arch" in
              x64) triple=x86_64-pc-windows-msvc ;;
              arm64) triple=aarch64-pc-windows-msvc ;;
            esac
            bin="$T/unsigned-$arch"
            rel="target/$triple/release"
            mkdir -p "$rel"
            cp "$bin/lpk-gui.exe" "$rel/lpk-gui.exe"
            rm -rf "$rel/bundle/nsis"
            python -I scripts/e7-nsis-overlay.py --arch "$arch" --bin "$bin" --repo "$(cygpath -m "$PWD")" \
              --out "$T/installers/overlay-$arch.json"
            log="$T/installers/bundle-$arch.log"
            # -v: tauri-bundler runs makensis with -V3 and shows its output, so its warnings can be checked (R330).
            (cd crates/lpk-gui && cargo tauri bundle --ci -v --bundles nsis --target "$triple" --no-binary-patching \
              --no-sign --config "$T/installers/overlay-$arch.json") 2>&1 | tee "$log"
            grep -q "Processing script file" "$log" || { echo "$log holds no makensis output"; exit 1; }
            if grep -nE "warning 6000" "$log"; then echo "makensis warning 6000 in $log"; exit 1; fi
            # The installer's name is the bundler's; exactly one, of this version and architecture.
            mapfile -t found < <(find "$rel/bundle/nsis" -maxdepth 1 -name '*-setup.exe')
            test "${#found[@]}" = 1 || { echo "expected one installer in $rel/bundle/nsis: ${found[*]}"; exit 1; }
            name="$(basename "${found[0]}")"
            case "$name" in
              *"_${VERSION}_${arch}-setup.exe") echo "$arch installer: $name" ;;
              *) echo "$name does not name version $VERSION and $arch"; exit 1 ;;
            esac
            cp "${found[0]}" "$T/installers/$name"
            # The bundler patched nothing in place either.
            (cd "$rel" && grep ' \*\?lpk-gui.exe$' "$bin/unsigned.sha256" | sha256sum -c -)
          done
          ls -la "$T/installers"
      # --no-binary-patching, checked from outside: 7-Zip (on the windows-2025 image) reads the NSIS installer's
      # files, and every PE it holds under a shipped name is byte-equal to the build job's (lpk-gui.exe required).
      - name: The installers hold the built PEs unchanged (7-Zip)
        run: |
          set -euo pipefail
          sz="$(cygpath -u "$PROGRAMFILES")/7-Zip/7z.exe"
          test -x "$sz" || { echo "no 7-Zip at $sz"; exit 1; }
          for arch in x64 arm64; do
            setup="$(ls "$T/installers/"*"_${arch}-setup.exe")"
            out="$T/unpacked-$arch"
            "$sz" l "$setup"
            "$sz" x -y -o"$out" "$setup" > /dev/null
            gui="$(find "$out" -iname lpk-gui.exe)"
            test "$(echo "$gui" | grep -c .)" = 1 || { echo "$arch: lpk-gui.exe not found once in the installer: $gui"; exit 1; }
            checked=0
            while read -r hash file; do
              file="${file#\*}"
              mapfile -t members < <(find "$out" -iname "$file")
              test "$file" != lpk-gui.exe || test "${#members[@]}" = 1
              for m in "${members[@]}"; do
                got="$(sha256sum "$m" | cut -d ' ' -f 1)"
                test "$got" = "$hash" || { echo "$arch: ${m#$out/} differs from the built $file"; exit 1; }
                echo "$arch: ${m#$out/} equals the built $file"
                checked=$((checked + 1))
              done
            done < "$T/unsigned-$arch/unsigned.sha256"
            echo "$arch: $checked PEs in the installer equal the build's"
          done
      # The NSIS installation the bundler used (tauri-bundler 2.10.4: %LOCALAPPDATA%\tauri\NSIS, as no
      # useLocalToolsDir is set): every PE in it, found by content, with its path relative to that folder, so that
      # assemble can require each of the installers' $PLUGINSDIR parts to be byte-equal to one of them.
      - name: nsis-parts.sha256 (every PE of the NSIS installation the bundler used)
        run: |
          set -euo pipefail
          nsis="$(cygpath -m "$LOCALAPPDATA")/tauri/NSIS"
          test -d "$nsis" || { echo "no NSIS installation at $nsis"; exit 1; }
          ls -laR "$nsis"
          python -I scripts/e7-artefacts.py nsis-parts "$nsis" > "$T/installers/nsis-parts.sha256"
          cat "$T/installers/nsis-parts.sha256"
      - name: installers.sha256
        id: list
        run: |
          cd "$T/installers"
          sha256sum *-setup.exe nsis-parts.sha256 > installers.sha256
          cat installers.sha256
          test "$(wc -l < installers.sha256)" = 3
          echo "sha256=$(sha256sum installers.sha256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # The artifact holds the two setups and nsis-parts.sha256 with installers.sha256, and also each architecture's
      # overlay (overlay-<arch>.json) and bundle log (bundle-<arch>.log): the evidence of how each setup was built.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: ${{ runner.temp }}/installers
          retention-days: 7
          if-no-files-found: error

  # The ARM64 installer on an x64 PC (as ci.yml's installer-arm64-refusal job runs the x64 one on ARM64): it exits
  # non-zero within five minutes and writes nothing.
  refuse-arm64-on-x64:
    name: ARM64 installer refuses on x64 (windows-2025)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    # Without these, Git's bash turns `/S` into a path (S:/), and the installer runs with its UI and waits.
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installers
          path: setup
      - name: Check the installers against installers.sha256 and its hash
        env:
          LIST: ${{ needs.package.outputs.list }}
        run: |
          test "$(sha256sum setup/installers.sha256 | cut -d ' ' -f 1)" = "$LIST" || { echo "installers.sha256 is not the package job's"; exit 1; }
          (cd setup && sha256sum -c installers.sha256)
      - name: The ARM64 installer exits with an error and installs nothing
        run: |
          inst="$(cygpath -m "$LOCALAPPDATA")/LitePack"
          test ! -e "$inst" || { echo "already present: $inst"; exit 1; }
          setup="$(ls setup/*_arm64-setup.exe)"
          rc=0; timeout 300 "$setup" /S || rc=$?
          test "$rc" -ne 124 || { echo "the installer did not exit in five minutes"; tasklist; exit 1; }
          echo "ARM64 installer on x64: exit code $rc"
          ls -la "$inst" 2>/dev/null && { echo "files were written to $inst"; exit 1; }
          test "$rc" -ne 0
          echo "refused on x64 with nothing installed"

  # The ARM64 installer on ARM64: a silent install, every installed PE ARM64 and byte-equal to the build's, bin\lpk.exe
  # runs and round-trips a folder, then a silent uninstall leaves no install folder. (The residue diff: part 1d.)
  install-arm64:
    name: ARM64 install and uninstall (windows-11-arm)
    needs: [preflight, build-arm64, package]
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      VERSION: ${{ needs.preflight.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # No setup-python here: it could not install 3.13.7 on windows-11-arm; this job uses bash and coreutils only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work folders
        run: |
          echo "T=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          echo "INST=$(cygpath -m "$LOCALAPPDATA")/LitePack" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installers
          path: ${{ runner.temp }}/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-arm64
          path: ${{ runner.temp }}/unsigned-arm64
      - name: Check the downloads against their lists and the lists against the jobs' outputs
        env:
          LIST: ${{ needs.package.outputs.list }}
          ARM64_LIST: ${{ needs.build-arm64.outputs.list }}
        run: |
          test "$(sha256sum "$T/setup/installers.sha256" | cut -d ' ' -f 1)" = "$LIST" || { echo "installers.sha256 is not the package job's"; exit 1; }
          test "$(sha256sum "$T/unsigned-arm64/unsigned.sha256" | cut -d ' ' -f 1)" = "$ARM64_LIST" || { echo "unsigned.sha256 is not build-arm64's"; exit 1; }
          (cd "$T/setup" && sha256sum -c installers.sha256)
          (cd "$T/unsigned-arm64" && sha256sum -c unsigned.sha256)
      - name: Install silently; every installed PE is ARM64 and the built one
        run: |
          set -euo pipefail
          test ! -e "$INST" || { echo "already present: $INST"; exit 1; }
          setup="$(ls "$T/setup/"*_arm64-setup.exe)"
          rc=0; timeout 300 "$setup" /S || rc=$?
          echo "ARM64 installer on ARM64: exit code $rc"
          test "$rc" -eq 0
          ls -laR "$INST"
          pes=(lpk-gui.exe bin/lpk.exe bin/lpk-check.exe bin/lpk-worker.exe bin/lpk-worker-libarchive.exe "shell/$VERSION/lpk_shell.dll")
          # The COFF Machine field read with od, as release-checks.yml's arm64-smoke does (no Python on this runner:
          # setup-python could not install 3.13.7 on windows-11-arm).
          for p in "${pes[@]}"; do
            b="$INST/$p"
            pe=$(od -An -tu4 -j60 -N4 "$b" | tr -d ' ')
            m=$(od -An -tx2 -j$((pe + 4)) -N2 "$b" | tr -d ' ')
            echo "$p: machine 0x$m"
            [ "$m" = "aa64" ] || { echo "error: $p is not ARM64" >&2; exit 1; }
          done
          for p in "${pes[@]}"; do
            want="$(grep -E " \*?$(basename "$p")\$" "$T/unsigned-arm64/unsigned.sha256" | cut -d ' ' -f 1 || true)"
            got="$(sha256sum "$INST/$p" | cut -d ' ' -f 1)"
            test -n "$want" && test "$got" = "$want" || { echo "$p: installed $got, built $want"; exit 1; }
            echo "$p: the built one"
          done
          "$INST/bin/lpk.exe" --version
      - name: bin\lpk.exe round-trips a small folder
        run: |
          set -euo pipefail
          w="$T/work"
          mkdir -p "$w/in/sub"
          for i in 1 2 3; do echo "file $i" > "$w/in/sub/f$i.txt"; done
          printf 'top\n' > "$w/in/top.txt"
          "$INST/bin/lpk.exe" a "$w/small.lpk" "$w/in"
          "$INST/bin/lpk.exe" x "$w/small.lpk" "$w/out"
          diff -r "$w/in" "$w/out"
          echo "round trip: the extracted files equal the originals"
      - name: Uninstall silently; no install folder is left
        run: |
          "$INST/uninstall.exe" /S
          scripts/e7-wait-uninstaller.sh "$INST"
          if [ -e "$INST" ]; then ls -laR "$INST"; echo "the uninstall left $INST"; exit 1; fi
          echo "uninstalled: $INST is gone"

  # The release's assets (part 1c): the portable and CLI zip of each architecture (scripts/make-zips.py, from the build
  # jobs' binaries) beside the two installers, the SBOM zip (part 1d: scripts/e7-sboms.py pack, from the build jobs'
  # sboms/), and SHA256SUMS over the seven (scripts/e7-assets.py). Then what is inside the six artefacts (the SBOM zip
  # aside: e7-sboms.py check reads it): each holds the notices and both licences once, byte-equal to the repository's
  # (E7-8 part 2), and every PE inside is either a shipped one of its architecture with .dep-v0, byte-equal to the
  # build's, or one of NSIS's own x86 parts (scripts/e7-artefacts.py). The job's output is the hash of SHA256SUMS,
  # which the smoke jobs check.
  assemble:
    name: release assets (windows-2025)
    needs: [preflight, build-x64, build-arm64, package]
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.sums.outputs.sha256 }}
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      VERSION: ${{ needs.preflight.outputs.version }}
      TIMESTAMP: ${{ needs.preflight.outputs.timestamp }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One exact Python build: the zips' bytes depend on its zlib and its zipfile (as ci.yml's portable job).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      - name: Work folders and 7-Zip
        run: |
          echo "T=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          sz="$(cygpath -m "$PROGRAMFILES")/7-Zip/7z.exe"
          test -f "$sz" || { echo "no 7-Zip at $sz"; exit 1; }
          echo "SZ=$sz" >> "$GITHUB_ENV"
          echo "version $VERSION, source commit time $TIMESTAMP"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-x64
          path: ${{ runner.temp }}/unsigned-x64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-arm64
          path: ${{ runner.temp }}/unsigned-arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installers
          path: ${{ runner.temp }}/installers
      - name: Check every download against its list and every list against its job's output
        env:
          X64_LIST: ${{ needs.build-x64.outputs.list }}
          ARM64_LIST: ${{ needs.build-arm64.outputs.list }}
          X64_SBOMS: ${{ needs.build-x64.outputs.sboms }}
          ARM64_SBOMS: ${{ needs.build-arm64.outputs.sboms }}
          INSTALLERS_LIST: ${{ needs.package.outputs.list }}
        run: |
          set -euo pipefail
          check() {
            local dir="$1" list="$2" want="$3"
            test -n "$want" || { echo "no expected hash for $dir/$list"; exit 1; }
            got="$(sha256sum "$dir/$list" | cut -d ' ' -f 1)"
            test "$got" = "$want" || { echo "$dir/$list: $got, the job's output is $want"; exit 1; }
            (cd "$dir" && sha256sum -c "$list")
          }
          check "$T/unsigned-x64" unsigned.sha256 "$X64_LIST"
          check "$T/unsigned-arm64" unsigned.sha256 "$ARM64_LIST"
          check "$T/unsigned-x64" sboms.sha256 "$X64_SBOMS"
          check "$T/unsigned-arm64" sboms.sha256 "$ARM64_SBOMS"
          check "$T/installers" installers.sha256 "$INSTALLERS_LIST"
          test "$(wc -l < "$T/unsigned-x64/unsigned.sha256")" = 6
          test "$(wc -l < "$T/unsigned-arm64/unsigned.sha256")" = 6
          test "$(wc -l < "$T/unsigned-x64/sboms.sha256")" = 6
          test "$(wc -l < "$T/unsigned-arm64/sboms.sha256")" = 6
          test "$(wc -l < "$T/installers/installers.sha256")" = 3
          grep -q ' \*\?nsis-parts.sha256$' "$T/installers/installers.sha256"
      - name: The asset, notices, PE, SBOM and zip scripts' own tests
        run: |
          python -I scripts/make-zips.py --self-test
          python -I scripts/e7-sboms.py --self-test
          python -I scripts/e7-assets.py --self-test
          python -I scripts/e7-artefacts.py --self-test --sevenzip "$SZ"
      - name: Both zips per architecture, and the two installers
        run: |
          set -euo pipefail
          mkdir -p "$T/assets"
          for arch in x64 arm64; do
            python -I scripts/make-zips.py --bin "$T/unsigned-$arch" --arch "$arch" --version "$VERSION" \
              --timestamp "$TIMESTAMP" --out "$T/assets"
          done
          while read -r hash file; do
            file="${file#\*}"
            case "$file" in *-setup.exe) cp "$T/installers/$file" "$T/assets/" ;; esac
          done < "$T/installers/installers.sha256"
          for z in "$T/assets/"*.zip; do python -I -m zipfile -l "$z"; done
          ls -la "$T/assets"
      - name: The SBOM zip (scripts/e7-sboms.py pack, then check)
        run: |
          set -euo pipefail
          python -I scripts/e7-sboms.py pack --version "$VERSION" --timestamp "$TIMESTAMP" \
            --x64 "$T/unsigned-x64/sboms" --arm64 "$T/unsigned-arm64/sboms" --out "$T/assets"
          python -I scripts/e7-sboms.py check "$T/assets/litepack-$VERSION-sbom.zip"
          python -I -m zipfile -l "$T/assets/litepack-$VERSION-sbom.zip"
      - name: SHA256SUMS over exactly the expected assets
        id: sums
        run: |
          set -euo pipefail
          python -I scripts/e7-assets.py expected --version "$VERSION"
          python -I scripts/e7-assets.py sums --version "$VERSION" "$T/assets"
          python -I scripts/e7-assets.py check --version "$VERSION" "$T/assets"
          (cd "$T/assets" && sha256sum -c SHA256SUMS)
          echo "sha256=$(sha256sum "$T/assets/SHA256SUMS" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: The notices and licences, once each in every artefact (E7-8 part 2)
        run: |
          python -I scripts/e7-artefacts.py notices "$T/assets" --version "$VERSION" --repo "$(cygpath -m "$PWD")" \
            --sevenzip "$SZ"
      # Also prints 7-Zip's full listing of each installer, so the classes can be read against it.
      - name: Every PE inside the artefacts, classified
        run: |
          python -I scripts/e7-artefacts.py pes "$T/assets" --version "$VERSION" --unsigned-x64 "$T/unsigned-x64" \
            --unsigned-arm64 "$T/unsigned-arm64" --nsis-parts "$T/installers/nsis-parts.sha256" --sevenzip "$SZ"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          retention-days: 14
          if-no-files-found: error

  # The zips on each architecture, as a user gets them: SHA256SUMS checked, then from the CLI zip every PE at the
  # runner's machine, `lpk --version`, a round trip, lpk-check, and a .zip through the sandboxed worker; from the
  # portable zip the GUI opens the .lpk and the .zip (as ci.yml's portable job), then the worker's profile is removed.
  smoke-x64:
    name: zips smoke x64 (windows-2025)
    needs: [preflight, assemble]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.7"
      - name: Work folders
        run: echo "T=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Check SHA256SUMS against the assemble job's output, then every asset
        env:
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          test -n "$SUMS"
          test "$(sha256sum "$T/assets/SHA256SUMS" | cut -d ' ' -f 1)" = "$SUMS" || { echo "SHA256SUMS is not the assemble job's"; exit 1; }
          (cd "$T/assets" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$T/assets/SHA256SUMS")" = 7
      # Windows' own tar.exe (bsdtar) reads zips: the same unzip on both runners, without Python.
      - name: Unzip the CLI and portable zips of this architecture
        run: |
          set -euo pipefail
          tar="$(cygpath -m "$SYSTEMROOT")/System32/tar.exe"
          for kind in cli portable; do
            mkdir -p "$T/$kind"
            "$tar" -xf "$T/assets/litepack-$VERSION-windows-$ARCH-$kind.zip" -C "$T/$kind"
            ls -la "$T/$kind/LitePack"
          done
      - name: The CLI zip's PEs are x64 (e7-pe-sections.py --machine)
        run: |
          c="$T/cli/LitePack"
          python -I scripts/e7-pe-sections.py --machine 0x8664 "$c/lpk.exe" "$c/lpk-check.exe" "$c/lpk-worker.exe" \
            "$c/lpk-worker-libarchive.exe"
      - name: lpk --version, a round trip, lpk-check, and a .zip through the worker (the CLI zip)
        run: |
          set -euo pipefail
          c="$T/cli/LitePack"
          line="$("$c/lpk.exe" --version | tr -d '\r')"
          echo "$line"
          case "$line" in "lpk $VERSION+"*) ;; *) echo "lpk --version does not name $VERSION"; exit 1 ;; esac
          w="$T/work"
          mkdir -p "$w/in/sub"
          for i in 1 2 3; do echo "file $i" > "$w/in/sub/f$i.txt"; done
          printf 'top\n' > "$w/in/top.txt"
          same() {
            (cd "$w/in" && find . -type f) | while read -r f; do cmp "$w/in/$f" "$1/$f" || exit 1; done
            test "$(cd "$w/in" && find . -type f | wc -l)" = "$(cd "$1" && find . -type f | wc -l)"
            echo "$1: the files equal the originals"
          }
          "$c/lpk.exe" a "$w/small.lpk" "$w/in"
          "$c/lpk.exe" x "$w/small.lpk" "$w/out-lpk"
          same "$w/out-lpk"
          "$c/lpk-check.exe" verify "$w/small.lpk"
          "$c/lpk.exe" export "$w/small.lpk" "$w/small.zip"
          "$c/lpk.exe" x "$w/small.zip" "$w/out-zip"
          same "$w/out-zip"
          ls -la "$w"
      - name: The portable GUI opens the .lpk, then the .zip
        run: |
          set -euo pipefail
          w="$T/work"
          gui="$T/portable/LitePack/lpk-gui.exe"
          for a in small.lpk small.zip; do
            LPK_GUI_SMOKE_REPORT="$w/report-$a.json" timeout 180 "$gui" "$w/$a"
            report="$(cat "$w/report-$a.json")"
            echo "report ($a): $report"
            grep -q "\"archive\":\"$a\"" <<<"$report"
            grep -q '"problems":\[\]' <<<"$report"
            grep -qE '"rendered":[1-9]' <<<"$report"
          done
          ls -la "$T/portable/LitePack" "$T/portable/LitePack/data"
      - name: The worker's profile removed from the portable copy
        if: ${{ !cancelled() }}
        run: '"$T/portable/LitePack/lpk-worker.exe" --remove-profile'

  smoke-arm64:
    name: zips smoke arm64 (windows-11-arm)
    needs: [preflight, assemble]
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: arm64
    defaults:
      run:
        shell: bash
    steps:
      # No setup-python here: it could not install 3.13.7 on windows-11-arm; this job uses bash, coreutils and
      # Windows' tar.exe only.
      - name: Work folders
        run: echo "T=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Check SHA256SUMS against the assemble job's output, then every asset
        env:
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          test -n "$SUMS"
          test "$(sha256sum "$T/assets/SHA256SUMS" | cut -d ' ' -f 1)" = "$SUMS" || { echo "SHA256SUMS is not the assemble job's"; exit 1; }
          (cd "$T/assets" && sha256sum -c SHA256SUMS)
          test "$(wc -l < "$T/assets/SHA256SUMS")" = 7
      - name: Unzip the CLI and portable zips of this architecture
        run: |
          set -euo pipefail
          tar="$(cygpath -m "$SYSTEMROOT")/System32/tar.exe"
          for kind in cli portable; do
            mkdir -p "$T/$kind"
            "$tar" -xf "$T/assets/litepack-$VERSION-windows-$ARCH-$kind.zip" -C "$T/$kind"
            ls -la "$T/$kind/LitePack"
          done
      # The COFF Machine field read with od, as install-arm64 does (no Python on this runner).
      - name: The CLI zip's PEs are ARM64 (od)
        run: |
          set -euo pipefail
          for p in lpk.exe lpk-check.exe lpk-worker.exe lpk-worker-libarchive.exe; do
            b="$T/cli/LitePack/$p"
            pe=$(od -An -tu4 -j60 -N4 "$b" | tr -d ' ')
            m=$(od -An -tx2 -j$((pe + 4)) -N2 "$b" | tr -d ' ')
            echo "$p: machine 0x$m"
            [ "$m" = "aa64" ] || { echo "error: $p is not ARM64" >&2; exit 1; }
          done
      - name: lpk --version, a round trip, lpk-check, and a .zip through the worker (the CLI zip)
        run: |
          set -euo pipefail
          c="$T/cli/LitePack"
          line="$("$c/lpk.exe" --version | tr -d '\r')"
          echo "$line"
          case "$line" in "lpk $VERSION+"*) ;; *) echo "lpk --version does not name $VERSION"; exit 1 ;; esac
          w="$T/work"
          mkdir -p "$w/in/sub"
          for i in 1 2 3; do echo "file $i" > "$w/in/sub/f$i.txt"; done
          printf 'top\n' > "$w/in/top.txt"
          same() {
            (cd "$w/in" && find . -type f) | while read -r f; do cmp "$w/in/$f" "$1/$f" || exit 1; done
            test "$(cd "$w/in" && find . -type f | wc -l)" = "$(cd "$1" && find . -type f | wc -l)"
            echo "$1: the files equal the originals"
          }
          "$c/lpk.exe" a "$w/small.lpk" "$w/in"
          "$c/lpk.exe" x "$w/small.lpk" "$w/out-lpk"
          same "$w/out-lpk"
          "$c/lpk-check.exe" verify "$w/small.lpk"
          "$c/lpk.exe" export "$w/small.lpk" "$w/small.zip"
          "$c/lpk.exe" x "$w/small.zip" "$w/out-zip"
          same "$w/out-zip"
          ls -la "$w"
      # The GUI's first run on windows-11-arm: a failure of the runner (no WebView2, no session) is reported, not
      # worked around; the CLI checks above stand on their own.
      - name: The portable GUI opens the .lpk, then the .zip
        run: |
          set -euo pipefail
          w="$T/work"
          gui="$T/portable/LitePack/lpk-gui.exe"
          for a in small.lpk small.zip; do
            LPK_GUI_SMOKE_REPORT="$w/report-$a.json" timeout 180 "$gui" "$w/$a"
            report="$(cat "$w/report-$a.json")"
            echo "report ($a): $report"
            grep -q "\"archive\":\"$a\"" <<<"$report"
            grep -q '"problems":\[\]' <<<"$report"
            grep -qE '"rendered":[1-9]' <<<"$report"
          done
          ls -la "$T/portable/LitePack" "$T/portable/LitePack/data"
      - name: The worker's profile removed from the portable copy
        if: ${{ !cancelled() }}
        run: '"$T/portable/LitePack/lpk-worker.exe" --remove-profile'
