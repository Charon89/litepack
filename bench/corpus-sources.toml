bundles = [
  { name = "office", class = "office-pdf", every = 7, max_files = 400, max_bytes = 8388608 },
  { name = "backup", class = "backup-versions", every = 9, max_files = 2000, max_bytes = 8388608 },
  { name = "logs", class = "logs-text", every = 1, max_files = 100, max_bytes = 8388608 },
]

