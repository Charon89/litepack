# Full-only extraction limits (checked against the archives' declared sizes): the whole HDFS_v1
# set fits the default extraction ceiling; the Windows log is cut by truncate_files, and its
# archive must hold few enough files to stay below the ceiling after the cut (a third file would
# fail the build loudly); PortableGit's 7z dictionary is within the decoder's bound.
