# LitePack corpus source registry (PLAN P0-2, docs/CORPUS.md).
#
# Format, lock semantics and how to add a source kind are documented in
# crates/lpk-bench/src/corpus/mod.rs. Pins live in bench/corpus.lock; after adding or changing
# a source run `lpk-bench corpus build --profile <p> --only <class> --update-lock` and commit
# the lock. Per-profile differences are separate sources with distinct ids.

# Per-host politeness: minimum gap between requests to the host, optional throughput cap, and
# optional retry patience (max_attempts, max_delay_ms).
[[host]]
name = "gutenberg.pglaf.org"
min_interval_ms = 2000

[[host]]
name = "r0k.us"
min_interval_ms = 1000

[[host]]
name = "archive.org"
min_interval_ms = 1000
# Patient: rides out an outage of several minutes (waits 2, 4, 8, 16, 32, 64, then 120 s each).
max_attempts = 11
max_delay_ms = 120000

[[host]]
name = "upload.wikimedia.org"
min_interval_ms = 1000
max_mbit_per_s = 25

[[host]]
name = "commons.wikimedia.org"
min_interval_ms = 1000

[[host]]
name = "oaipmh.arxiv.org"
min_interval_ms = 3000

[[host]]
name = "export.arxiv.org"
min_interval_ms = 3000

[[host]]
name = "zenodo.org"
min_interval_ms = 1000

[[host]]
name = "data.cityofnewyork.us"
min_interval_ms = 1000

[[host]]
name = "kenney.nl"
min_interval_ms = 1000

[[host]]
name = "github.com"
min_interval_ms = 1000

[[host]]
name = "raw.githubusercontent.com"
min_interval_ms = 500

[[host]]
name = "huggingface.co"
min_interval_ms = 1000

