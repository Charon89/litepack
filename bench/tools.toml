# Catalogue of baseline tools read by `lpk-bench run` (docs/PLAN.md P0-3, docs/BASELINES.md).
# Committed and machine-independent: no absolute paths. The versions actually used are recorded
# per results directory in `tools.json`. A machine overrides or supplies tools in the untracked
# `bench/tools.local.toml` (same `[[tool]]` shape, matched by `id`; see docs/BASELINES.md).
#
# Keys per [[tool]]:
#   id, name        identifier (`[a-z0-9-]+`) and display name
#   exe.<os>        executable names to look for, per OS (`windows`, `linux`, `macos`)
#   hints.<os>      install-location hints, tried after PATH (before it when `hints_first`);
#                   `%VAR%` is an environment variable; `*` inside a folder or file name matches
#                   any text (winget portable folders carry the version; the highest version,
#                   digit runs compared as numbers, wins)
#   hints_first     true: try the hints before PATH (`store` needs the Windows bsdtar, not the
#                   GNU tar that Git for Windows puts on PATH)
#   version         { args, pattern }: run with args, capture group 1 of pattern on stdout+stderr
#                   (`)` characters are dropped, so `GNU tar) 1.35` is recorded as `GNU tar 1.35`)
#   extension       archive file extension
#   mode            `directory` (tool archives a directory itself) or `tar-stream`. Tar-stream tools
#                   run in two sequential steps through a temporary file, never concurrently:
#                   compress = the `store` tool's tar writes the stream to a temporary tar file,
#                   then the tool reads that file on its standard input and writes the archive
#                   to its standard output; extract = the tool reads the archive on its standard
#                   input and writes a temporary tar file, then tar extracts it. The published
#                   time is the sum of the two steps (each is also recorded), the published peak
#                   memory the larger of the two.
#   layout          directory mode only. Where the extracted tree appears relative to `{outdir}`:
#                   `flat` (the files of the input directory) or `nested` (inside a directory
#                   named like `{input}`). Default `flat`.
#   create/extract  argument templates. Placeholders: {archive} {input} {outdir} {settings}
#                   {threads} {list} {sep}; `{settings}` expands to the setting's compress or
#                   extract arguments; `{sep}` is the platform's path separator (a tool that
#                   wants a trailing separator on the output directory: `{outdir}{sep}`)
#   create_list     optional, directory mode: the create template for a private corpus, where the
#                   runner gives the tool a list file of relative paths (placeholder `{list}`)
#                   and runs it in the corpus root. Tools without it are skipped for private
#                   corpora. The extracted tree is then flat, whatever `layout` says. On Windows
#                   the tar of `store` cannot read non-ASCII names from a list: such a class is
#                   skipped for `store` (and for tar-stream tools).
#   threads         thread-count template; `{n}` is the number; expands to one or more arguments
#   ratio_depends_on_threads
#                   true when the thread count changes the archive size, not only the speed.
#                   Copied into every result. Unknown for manual tools: the owner sets it in
#                   bench/tools.local.toml.
#   dedup           true when the tool deduplicates across files (default false; D-43). Gate G2
#                   is compared against the best tool without this flag; flagged tools' best
#                   rows are printed as reference only. Recorded in `tools.json`.
#
# Working-directory rules. CREATE (every directory-mode tool and the tar step of tar-stream
# tools): the runner executes the tool with its working directory set to the parent of the class
# directory, and passes `{input}` as a path relative to it (the class directory's name), and
# `{archive}` relative to it as well. No archive then contains an absolute path. EXTRACT (every
# tool, and both steps of tar-stream tools): the working directory is the combination's scratch
# directory, and `{archive}` and `{outdir}` are plain names in it (`a<ext>`, `x`), because some
# tools mishandle an output path that contains `..` or `/` (WinRAR's long-path handling, and
# zpaqfranz extracting nothing when `-to` climbs two or more directories). One rule for all tools.
# The templates below were run that way against the real tools: create, extract into an empty
# directory, compare with the input tree.
# All settings run at the machine's thread count, as a user would run them.
# Every tool runs with its output redirected and without a console, so nothing may wait for a
# keypress: each template pins the tool's assume-yes and quiet or no-progress switches. The
# runner never parses tool output (file names differ by code page); only the BLAKE3 of the
# extracted files decides whether a round trip worked.
#
#   licence         licence note; install = { winget, apt, url } hints
#   manual          true: the owner licenses and configures the tool by hand (docs/BASELINES.md)
#   verified        false: command lines taken from documentation, never run by us
#   note            free text
# Flags checked against current versions on 2026-10-01 unless `verified = false`.

[[tool]]
id = "store"
name = "tar (store, control)"
exe = { windows = ["tar"], linux = ["tar"], macos = ["tar"] }
hints = { windows = ["%SystemRoot%/System32/tar.exe"] }
hints_first = true
version = { args = ["--version"], pattern = '(bsdtar \d+(?:\.\d+)+|GNU tar\)? \d+(?:\.\d+)+)' }
ratio_depends_on_threads = false
extension = ".tar"
mode = "directory"
create = ["-cf", "{archive}", "-C", "{input}", "."]
create_list = ["-cf", "{archive}", "-T", "{list}"]
extract = ["-xf", "{archive}", "-C", "{outdir}"]
threads = []
licence = "bsdtar (BSD-2-Clause) or GNU tar (GPL-3.0-or-later), used as an external program only"
install = { apt = "tar", url = "bundled with Windows 10 and later" }
note = "Tar without compression: the control for every other tool. On Windows the System32 bsdtar is used: GNU tar reads `D:` in an archive path as a remote host."
[[tool.setting]]
id = "store"
compress = []
extract = []

[[tool]]
id = "7z"
name = "7-Zip"
exe = { windows = ["7z"], linux = ["7zz", "7z"], macos = ["7zz"] }
hints = { windows = ["%ProgramFiles%/7-Zip/7z.exe", "%ProgramFiles(x86)%/7-Zip/7z.exe", "%LOCALAPPDATA%/Programs/7-Zip/7z.exe"] }
version = { args = [], pattern = '7-Zip[^\d\r\n]*(\d+(?:\.\d+)+)' }
extension = ".7z"
mode = "directory"
layout = "nested"
create = ["a", "-bd", "-y", "{settings}", "{threads}", "{archive}", "{input}"]
create_list = ["a", "-bd", "-y", "-scsUTF-8", "{settings}", "{threads}", "{archive}", "@{list}"]
extract = ["x", "-bd", "-y", "{threads}", "-o{outdir}", "{archive}"]
threads = ["-mmt={n}"]
ratio_depends_on_threads = true
licence = "LGPL-2.1-or-later with unRAR restriction; used as an external program only"
install = { winget = "7zip.7zip", apt = "7zip", url = "https://www.7-zip.org/" }
note = "Catalogued against 7-Zip 26.03; the executable is `7zz` on Linux."
[[tool.setting]]
id = "mx5"
compress = ["-mx5"]
extract = []
[[tool.setting]]
id = "ultra"
compress = ["-mx9", "-mqs"]
extract = []

[[tool]]
id = "rar"
name = "WinRAR (rar)"
exe = { windows = ["rar"], linux = ["rar"], macos = ["rar"] }
hints = { windows = ["%ProgramFiles%/WinRAR/Rar.exe", "%ProgramFiles(x86)%/WinRAR/Rar.exe"] }
version = { args = [], pattern = 'RAR (\d+(?:\.\d+)+)' }
extension = ".rar"
mode = "directory"
create = ["a", "-r", "-ep1", "-cfg-", "-idq", "-y", "{settings}", "{threads}", "{archive}", "{input}/*"]
create_list = ["a", "-idq", "-y", "-scfl", "-cfg-", "{settings}", "{threads}", "{archive}", "@{list}"]
extract = ["x", "-cfg-", "-idq", "-y", "{threads}", "{archive}", "{outdir}{sep}"]
threads = ["-mt{n}"]
ratio_depends_on_threads = true
licence = "Proprietary: 40-day trial, then a paid licence"
install = { winget = "RARLab.WinRAR", apt = "rar (multiverse)", url = "https://www.rarlab.com/" }
note = "Catalogued against WinRAR 7.23. Thread-count dependence of the archive size was seen on one sample (1 versus 4 threads) and not otherwise checked. WinRAR is non-solid by default, which is what PLAN lists and what most users get; `best-solid` adds -s for its strongest sensible configuration. The -rr3% setting differs from `best` only by the recovery record."
[[tool.setting]]
id = "m3"
compress = ["-m3"]
extract = []
[[tool.setting]]
id = "best"
compress = ["-m5", "-md256m"]
extract = []
[[tool.setting]]
id = "best-solid"
compress = ["-m5", "-md256m", "-s"]
extract = []
[[tool.setting]]
id = "best-rr3"
compress = ["-m5", "-md256m", "-rr3%"]
extract = []

[[tool]]
id = "zstd"
name = "Zstandard"
exe = { windows = ["zstd"], linux = ["zstd"], macos = ["zstd"] }
hints = { windows = ["%LOCALAPPDATA%/Microsoft/WinGet/Links/zstd.exe", "%LOCALAPPDATA%/Microsoft/WinGet/Packages/Meta.Zstandard_*/zstd-v*/zstd.exe"] }
version = { args = ["--version"], pattern = 'v(\d+(?:\.\d+)+)' }
extension = ".tar.zst"
mode = "tar-stream"
create = ["-q", "{settings}", "{threads}", "-c"]
extract = ["-d", "-q", "{settings}", "-c"]
threads = ["-T{n}"]
ratio_depends_on_threads = true
licence = "BSD-3-Clause OR GPL-2.0-only; used as an external program only"
install = { winget = "Meta.Zstandard", apt = "zstd", url = "https://github.com/facebook/zstd" }
note = "Catalogued against zstd 1.5.7. Decoding a --long=27 stream needs no extra flag at that window size."
[[tool.setting]]
id = "3"
compress = ["-3"]
extract = []
[[tool.setting]]
id = "19"
compress = ["-19"]
extract = []
[[tool.setting]]
id = "ultra22-long27"
compress = ["--ultra", "-22", "--long=27"]
extract = []

[[tool]]
id = "xz"
name = "XZ Utils"
exe = { windows = ["xz"], linux = ["xz"], macos = ["xz"] }
hints = { windows = ["%LOCALAPPDATA%/Microsoft/WinGet/Links/xz.exe", "%LOCALAPPDATA%/Microsoft/WinGet/Packages/TukaaniProject.XZUtils_*/bin_x86-64/xz.exe"] }
version = { args = ["--version"], pattern = 'xz[^\d\r\n]*(\d+(?:\.\d+)+)' }
extension = ".tar.xz"
mode = "tar-stream"
create = ["-q", "{settings}", "{threads}", "-c"]
extract = ["-d", "-q", "{settings}", "{threads}", "-c"]
threads = ["-T{n}"]
ratio_depends_on_threads = true
licence = "0BSD (liblzma) and GPL-2.0-or-later (command line tool); used as an external program only"
install = { winget = "TukaaniProject.XZUtils", apt = "xz-utils", url = "https://tukaani.org/xz/" }
note = "Catalogued against xz 5.8."
[[tool.setting]]
id = "6"
compress = ["-6"]
extract = []
[[tool.setting]]
id = "9"
compress = ["-9"]
extract = []

[[tool]]
id = "zpaqfranz"
name = "zpaqfranz"
exe = { windows = ["zpaqfranz"], linux = ["zpaqfranz"], macos = ["zpaqfranz"] }
version = { args = ["-h"], pattern = 'zpaqfranz v?(\d+(?:\.\d+)*)' }
extension = ".zpaq"
mode = "directory"
layout = "nested"
create = ["a", "{archive}", "{input}", "{settings}", "{threads}", "-noeta"]
extract = ["x", "{archive}", "-to", "{outdir}/", "{threads}", "-noeta"]
threads = ["-t{n}"]
ratio_depends_on_threads = false
dedup = true
licence = "MIT"
install = { url = "https://github.com/fcorbelli/zpaqfranz" }
note = "Run against zpaqfranz 65.4 (create, extract, compare). `-t N` as two arguments is not accepted; `-t4` is. Archive size did not change with the thread count at -m1 in a check on a source-code sample; -m5 was not checked."
[[tool.setting]]
id = "m1"
compress = ["-m1"]
extract = []
[[tool.setting]]
id = "m5"
compress = ["-m5"]
extract = []

[[tool]]
id = "lpk"
name = "LitePack"
exe = { windows = ["lpk"], linux = ["lpk"], macos = ["lpk"] }
hints_first = true
hints = { windows = ["target/release/lpk.exe"], linux = ["target/release/lpk"], macos = ["target/release/lpk"] }
version = { args = ["--version"], pattern = 'lpk (\S+)' }
extension = ".lpk"
mode = "directory"
layout = "flat"
create = ["a", "{archive}", "{input}", "{settings}", "{threads}"]
extract = ["x", "{archive}", "{outdir}", "{threads}"]
threads = ["--threads", "{n}"]
ratio_depends_on_threads = false
licence = "Apache-2.0 OR MIT (this repository)"
install = { url = "built from this repository: cargo build --release -p lpk-cli" }
note = "This repository's own build (target/release, found relative to the current directory), measured like any other tool. The version carries the build hash. Parallel encoding is not implemented yet, so the thread count does not change the result."
[[tool.setting]]
id = "fast"
compress = ["--fast"]
extract = []
[[tool.setting]]
id = "balanced"
compress = ["--balanced"]
extract = []
[[tool.setting]]
id = "balanced-unordered"
compress = ["--balanced", "--ordering", "none"]
extract = []
[[tool.setting]]
id = "store"
compress = ["--store"]
extract = []

[[tool]]
id = "tsaur"
name = "t-saur"
exe = { windows = ["tsaur"], linux = ["tsaur"], macos = ["tsaur"] }
version = { args = ["--version"], pattern = '(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' }
extension = ".tsaur"
mode = "directory"
create = ["pack", "{archive}", "{input}", "{settings}", "{threads}"]
extract = ["unpack", "{archive}", "{outdir}", "{threads}"]
threads = ["--jobs", "{n}"]
ratio_depends_on_threads = false
dedup = true
licence = "Apache-2.0 OR MIT"
install = { url = "https://github.com/iulianbondari/t-saur" }
verified = false
note = "Catalogued against 1.0.0-rc.2. Command lines from the project README; not run by us. Its lite builds need --no-lepton, which a machine adds in bench/tools.local.toml."
[[tool.setting]]
id = "default"
compress = []
extract = []
[[tool.setting]]
id = "max"
compress = ["--codec", "best", "--level", "19"]
extract = []

[[tool]]
id = "wzzip"
name = "WinZip command line"
exe = { windows = ["wzzip"] }
hints = { windows = ["%ProgramFiles%/WinZip/wzzip.exe", "%ProgramFiles(x86)%/WinZip/wzzip.exe"] }
version = { args = ["-h"], pattern = 'WinZip[^\d\r\n]*(\d+(?:\.\d+)*)' }
extension = ".zip"
mode = "directory"
threads = []
licence = "Proprietary, paid licence (WinZip plus the Command Line add-on)"
install = { url = "https://www.winzip.com/" }
manual = true
verified = false
note = "Strongest-setting flags not verified. The owner supplies command lines in bench/tools.local.toml (docs/BASELINES.md)."

[[tool]]
id = "pacl"
name = "PowerArchiver command line"
exe = { windows = ["pacl"] }
hints = { windows = ["%ProgramFiles%/PowerArchiver/pacl.exe", "%ProgramFiles(x86)%/PowerArchiver/pacl.exe"] }
version = { args = [], pattern = '(\d+\.\d+(?:\.\d+)*)' }
extension = ".zip"
mode = "directory"
threads = []
licence = "Proprietary, paid licence"
install = { url = "https://www.powerarchiver.com/" }
manual = true
verified = false
note = "Strongest-setting flags and archive format not verified. The owner supplies command lines (and the extension) in bench/tools.local.toml (docs/BASELINES.md)."
