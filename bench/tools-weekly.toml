# The weekly speed-regression run's catalogue (PLAN E8-3, docs/notes/e8-3-design.md), passed by
# scripts/e8-3-weekly.sh as `lpk-bench run --catalogue bench/tools-weekly.toml`.
#
# Editing this file starts a new baseline: `run --compare` refuses two runs whose catalogue files
# differ (`catalogue_blake3` in run.json), so the first weekly run after an edit is recorded as
# BASELINE instead of being compared with the week before.
#
# The rows below are `bench/tools.toml`'s `7z` and `lpk` rows copied verbatim, with all their
# settings; the weekly run picks `fast,balanced,store,mx5` with `--settings`. Both tools run in
# directory mode, so there is no `store` (tar) tool row. The keys are documented in the header of
# `bench/tools.toml`.

[[tool]]
id = "7z"
name = "7-Zip"
exe = { windows = ["7z"], linux = ["7zz", "7z"], macos = ["7zz"] }
hints = { windows = ["%ProgramFiles%/7-Zip/7z.exe", "%ProgramFiles(x86)%/7-Zip/7z.exe", "%LOCALAPPDATA%/Programs/7-Zip/7z.exe"] }
version = { args = [], pattern = '7-Zip[^\d\r\n]*(\d+(?:\.\d+)+)' }
extension = ".7z"
mode = "directory"
layout = "nested"
create = ["a", "-bd", "-y", "{settings}", "{threads}", "{archive}", "{input}"]
create_list = ["a", "-bd", "-y", "-scsUTF-8", "{settings}", "{threads}", "{archive}", "@{list}"]
extract = ["x", "-bd", "-y", "{threads}", "-o{outdir}", "{archive}"]
threads = ["-mmt={n}"]
ratio_depends_on_threads = true
licence = "LGPL-2.1-or-later with unRAR restriction; used as an external program only"
install = { winget = "7zip.7zip", apt = "7zip", url = "https://www.7-zip.org/" }
note = "Catalogued against 7-Zip 26.03; the executable is `7zz` on Linux."
[[tool.setting]]
id = "mx5"
compress = ["-mx5"]
extract = []
[[tool.setting]]
id = "ultra"
compress = ["-mx9", "-mqs"]
extract = []

[[tool]]
id = "lpk"
name = "LitePack"
exe = { windows = ["lpk"], linux = ["lpk"], macos = ["lpk"] }
hints_first = true
hints = { windows = ["target/release/lpk.exe"], linux = ["target/release/lpk"], macos = ["target/release/lpk"] }
version = { args = ["--version"], pattern = 'lpk (\S+)' }
extension = ".lpk"
mode = "directory"
layout = "flat"
create = ["a", "{archive}", "{input}", "{settings}", "{threads}"]
# A private corpus (D-20 (6)): the inputs come from the runner's list file, one relative path
# per line, each entered under that path (E3-4's `--list`).
create_list = ["a", "{archive}", "--list", "{list}", "{settings}", "{threads}"]
extract = ["x", "{archive}", "{outdir}", "{settings}", "{threads}"]
threads = ["--threads", "{n}"]
ratio_depends_on_threads = false
licence = "Apache-2.0 OR MIT (this repository)"
install = { url = "built from this repository: cargo build --release -p lpk-cli" }
note = "This repository's own build (target/release, found relative to the current directory), measured like any other tool. The version carries the build hash. Parallel encoding is not implemented yet, so the thread count does not change the result."
[[tool.setting]]
id = "fast"
compress = ["--fast"]
extract = []
# Mark of the Web's cost (E6-5, docs/notes/e6-design.md section 4): the runner writes a
# Zone.Identifier stream with ZoneId=3 onto the archive before extraction (Windows only), so
# `fast-zoned` extracts with propagation (every file gets the stream) and `fast-zoned-no-motw`
# the same zoned archive with the opt-out; both against `fast` on `small-files`. Outside
# Windows both rows are recorded as skipped ("zone streams need Windows"). They exist for that
# one comparison: a full run that should leave them out names its settings with `--settings`
# (for example `--settings fast,balanced,...`), and E6-5's row picks them the same way:
# `--tools lpk --settings fast,fast-zoned,fast-zoned-no-motw --classes small-files`.
[[tool.setting]]
id = "fast-zoned"
compress = ["--fast"]
extract = []
zone = 3
[[tool.setting]]
id = "fast-zoned-no-motw"
compress = ["--fast"]
extract = ["--motw", "off"]
zone = 3
# The JPEG peel's A/B on the Fast tier (E2-25, route (a)): `fast` carries the peel; this row
# stores JPEGs as they are, so their extraction is a copy.
[[tool.setting]]
id = "fast-no-jpeg"
compress = ["--fast", "--jpeg-peel", "off"]
extract = []
[[tool.setting]]
id = "balanced"
compress = ["--balanced"]
extract = []
[[tool.setting]]
id = "balanced-extension"
compress = ["--balanced", "--ordering", "extension"]
extract = []
# The version ordering's A/B (E2-9 task E): a file's versions adjacent inside the window. Since
# E2-26 the `balanced` default orders so too; this row stays for the comparison.
[[tool.setting]]
id = "balanced-versions"
compress = ["--balanced", "--ordering", "versions"]
extract = []
# The old order (E2-26, D-104): `balanced` carries the version ordering by default since E2-26;
# this row restores path order so the ordering stays measurable.
[[tool.setting]]
id = "balanced-no-versions"
compress = ["--balanced", "--ordering", "none"]
extract = []
# The Deflate peel's A/B (E2-10): `balanced` carries the peel by default; this row turns it off.
[[tool.setting]]
id = "balanced-no-deflate"
compress = ["--balanced", "--deflate-peel", "off"]
extract = []
# The BWT stage's A/B (E2-15, revision 1.3): `balanced` carries the stage by default; this row
# turns it off.
[[tool.setting]]
id = "balanced-no-bwt"
compress = ["--balanced", "--bwt", "off"]
extract = []
# The PNG row-filter re-encoding's A/B (E2-16, revision 1.4): `balanced` carries it by default;
# this row turns it off.
[[tool.setting]]
id = "balanced-no-png-filter"
compress = ["--balanced", "--png-filter", "off"]
extract = []
[[tool.setting]]
id = "store"
compress = ["--store"]
extract = []
# The Fast tier sealed with a password (AES-256-GCM, Argon2id at the format's default cost):
# the cost of encryption against the `fast` row. The password is a benchmark credential only,
# not a secret: it is the same on every machine and in every result file.
[[tool.setting]]
id = "fast-encrypted"
compress = ["--fast", "--password", "lpk-bench-password"]
extract = ["--password", "lpk-bench-password"]
