# E7-8 (docs/notes/e7-design.md section 7): the Microsoft.Web.WebView2 NuGet package whose x64 and arm64
# build/native/<arch>/WebView2LoaderStatic.lib equal, byte for byte, the files vendored by the webview2-com-sys
# that Cargo.lock resolves (and lpk-gui.exe links). Found by CI over every release after 1.0.3650.58 (the version
# webview2-com-sys 0.38.2's changelog names); 1.0.3800.47 was the only match. notices/webview2/LICENSE.txt is that
# package's LICENSE.txt, byte for byte; scripts/third-party-notices.sh renders it in the GUI section.
# scripts/webview2-notice.sh --check (CI job "notices pins") downloads the package from nuget.org and checks every
# value here, so a webview2-com-sys bump with other libraries fails until this pin moves.

crate = "webview2-com-sys"
crate_version = "0.39.1"
package = "Microsoft.Web.WebView2"
version = "1.0.3800.47"
url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3800.47/microsoft.web.webview2.1.0.3800.47.nupkg"
