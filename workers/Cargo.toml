# The workers' workspace (E4-2; docs/notes/e4-design.md §3): the sandboxed foreign-format workers,
# kept apart from the main workspace so that its feature unification (the host enables C zlib and
# zstd) can never pull a C codec into a worker. Its own lockfile, deny.toml and CI job; lpk-proto
# and lpk-sandbox-sys are shared by path. Run cargo inside this directory (see .cargo/config.toml).
[workspace]
resolver = "2"
members = ["lpk-worker"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Charon89/litepack"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
