[package]
name = "lpk-worker"
description = "LitePack's sandboxed foreign-format worker: reads one archive through its handle and answers the broker over pipes; never writes a file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published; also how cargo-about and cargo-deny's private rule leave our own crates out.
publish = false

[features]
# Test-only fault injection (garbage, hangs, a closed pipe, endless pages). Never in a shipped
# worker: the CI job fails when `cargo tree -e features` of a default build shows it.
faults = ["lpk-proto/faults"]

[dependencies]
lpk-proto = { path = "../../crates/lpk-proto", version = "0.0.1" }
# The pure-Rust foreign readers (E4-3); this binary is the only crate that links them.
lpk-foreign = { path = "../lpk-foreign", version = "0.0.1" }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
lpk-sandbox-sys = { path = "../../crates/lpk-sandbox-sys", version = "0.0.1" }

[dev-dependencies]
tempfile = "3.27.0"
# BLAKE3 equality of what `lpk x` extracts through the worker (tests/cli.rs).
blake3 = "1.8.7"
# E4-7's hostile fixtures (tests/hostile.rs): ZIP CRCs and Deflate bodies built in the test
# with the readers' own crates and features (no C codec), and the host's wall time and peak
# working set measured as the benchmark runner measures them.
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
lpk-procstat-sys = { path = "../../crates/lpk-procstat-sys", version = "0.0.1" }

[lints]
workspace = true
